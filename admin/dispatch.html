<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center | Pahatid Admin</title>
    
    <!-- CSS Libraries -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="../assets/css/style.css">
    
    

    <!-- AUTO-INJECTED MANDATORY LAYOUT CORE BY pahatid_autofix.py -->
    <style>
        /* =========================================
           PAHATID SYSTEM - MANDATORY LAYOUT CORE
           Version: 3.7.0 (Final Stable Release)
           Description: Unified Sidebar, Hamburger & Document Flow Logic
           ========================================= */

        /* --- 1. GLOBAL RESETS & BODY FLOW --- */
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #f4f6f9;
            overflow-x: hidden; 
            height: auto; 
        }

        /* --- 2. THE APP WRAPPER (Flex Container) --- */
        .app-wrapper {
            display: flex;
            width: 100%;
            min-height: 100vh; 
            position: relative;
            align-items: flex-start; 
        }

        /* --- 3. SIDEBAR BEHAVIOR --- */
        .sidebar {
            width: 260px;
            background: #212529;
            color: white;
            position: sticky; 
            top: 0;
            height: 100vh; 
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease-in-out;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            overflow-y: auto; 
            flex-shrink: 0;
        }

        /* --- 4. MAIN CONTENT AREA --- */
        .main-content {
            flex-grow: 1;
            width: calc(100% - 260px); 
            position: relative;
            background: #f4f6f9;
            min-height: 100vh;
        }

        /* --- 5. HAMBURGER BUTTON (PERSISTENT OVERLAY) --- */
        .mobile-menu-toggle {
            display: none; 
            position: fixed !important; 
            top: 15px;
            left: 15px;
            z-index: 9999; 
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--pahatid-primary, #0d6efd);
            color: white;
            border: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: transform 0.2s;
        }
        .mobile-menu-toggle:active { transform: scale(0.9); }

        /* --- 6. SIDEBAR OVERLAY (MOBILE BACKDROP) --- */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 998; 
            opacity: 0;
            transition: opacity 0.3s;
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.active {
            display: block;
            opacity: 1;
        }

        /* --- 7. MOBILE RESPONSIVENESS (< 992px) --- */
        @media (max-width: 991.98px) {
            
            .app-wrapper {
                display: block; 
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100dvh; 
                width: min(280px, 85vw); 
                transform: translateX(-100%); 
                box-shadow: none;
                z-index: 1000;
                overflow-y: auto;
            }
            
            .sidebar.open {
                transform: translateX(0);
                box-shadow: 5px 0 15px rgba(0,0,0,0.2);
            }

            .main-content {
                width: 100%;
                margin-left: 0;
            }

            .mobile-menu-toggle {
                display: flex !important; 
            }

            .page-title-row, 
            header.main-header:first-child {
                padding-left: 60px !important; 
            }
        }
    </style>

</head>
<body>

    <!-- Mobile Menu Toggle Button -->
    <button class="mobile-menu-toggle" id="menuToggleBtn" aria-label="Toggle Navigation">
        <i class="fas fa-bars"></i>
    </button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- LOADING OVERLAY -->
    <div class="loading-overlay" id="globalLoader">
        <div class="spinner-border text-primary mb-3" role="status"></div>
        <p class="fw-bold text-muted">Syncing Data...</p>
    </div>

    <div class="app-wrapper">
        
        <!-- GLOBAL SIDEBAR NAVIGATION (Admin Context - Dynamic) -->
                <!-- GLOBAL SIDEBAR NAVIGATION (Admin Context - Dynamic) -->
                <!-- GLOBAL SIDEBAR NAVIGATION (Admin Context - Dynamic) -->
                <!-- GLOBAL SIDEBAR NAVIGATION (Admin Context - Dynamic) -->
                <!-- GLOBAL SIDEBAR NAVIGATION (Admin Context - Dynamic) -->
                <!-- GLOBAL SIDEBAR NAVIGATION (Admin Context - Dynamic) -->
        <aside class="sidebar" id="globalSidebar">
            <div class="sidebar-header p-3 border-bottom border-dark">
                <a href="/pahatid-system-project/" class="text-decoration-none text-white fw-bold fs-5 d-block">
                    <i class="fas fa-shield-alt text-warning me-2"></i> Pahatid<span class="fw-normal ms-1">Admin</span>
                </a>
            </div>
            <ul class="nav flex-column p-2" id="dynamicNavList">
                <!-- Items loaded by sidebar-loader.js -->
            </ul>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="main-content">
            
            <!-- FIXED HEADER AREA -->
            <div class="command-header-area">
                <div class="page-title-row">
                    <h5 class="mb-0 fw-bold"><i class="fas fa-satellite-dish me-2 text-primary"></i> Live Command Center</h5>
                    <button class="btn btn-sm btn-outline-secondary rounded-circle" style="width:36px;height:36px;padding:0;" onclick="refreshAllData()">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
                
                <div class="controls-row">
                    <div class="search-icon-wrapper w-100">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" class="form-control form-control-search" placeholder="Search Ref Code or Name...">
                    </div>
                    
                    <!-- Auto Dispatch Toggle -->
                    <div class="toggle-container d-none d-md-flex" id="autoDispatchControlContainer">
                        <span>Auto Assign</span>
                        <label class="switch">
                            <input type="checkbox" id="autoDispatchToggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <!-- TABS NAVIGATION -->
                <div class="tabs-nav-container">
                    <div class="nav-pills-custom" id="commandTabsNav">
                        <button class="nav-pill-btn active" data-tab="incoming">
                            <i class="fas fa-inbox me-1"></i> Incoming Queue <span class="pill-badge bg-warning text-dark" id="count-incoming">0</span>
                        </button>
                        <button class="nav-pill-btn" data-tab="active">
                            <i class="fas fa-route me-1"></i> Active Fleet <span class="pill-badge bg-success text-white" id="count-active">0</span>
                        </button>
                        <button class="nav-pill-btn" data-tab="issues">
                            <i class="fas fa-exclamation-triangle me-1"></i> Issues <span class="pill-badge bg-danger text-white" id="count-issues">0</span>

            </div>

            <!-- SCROLLABLE CONTENT AREA -->
            <div class="scrollable-content-area">
                
                <!-- SECTION 1: INCOMING QUEUE -->
                <div class="content-section active" id="section-incoming">
                    <div class="trip-card-list" id="incomingListContainer">
                        <div class="empty-state-mobile">
                            <i class="fas fa-spinner fa-spin"></i>
                            <p>Loading incoming orders...</p>
                        </div>
                    </div>
                </div>

                <!-- SECTION 2: ACTIVE FLEET MONITOR -->
                <div class="content-section" id="section-active">
                    <div class="trip-card-list" id="activeListContainer">
                         <div class="empty-state-mobile">
                            <i class="fas fa-spinner fa-spin"></i>
                            <p>Loading active trips...</p>
                        </div>
                    </div>
                </div>

                <!-- SECTION 3: ISSUES (CANCELLATIONS) -->
                <div class="content-section" id="section-issues">
                    <div class="trip-card-list" id="issuesListContainer">
                         <div class="empty-state-mobile">
                            <i class="fas fa-check-circle text-success"></i>
                            <p>No pending issues.</p>

            </div>

        </main>

    <!-- ASSIGNMENT MODAL -->
    <div id="assignModal">
        <div class="modal-box">
            <span class="close-btn" onclick="closeAssignModal()">&times;</span>
            <h4 style="margin-top:0;">Assign Driver</h4>
            <p style="font-size:0.9rem; color:#666; margin-bottom:15px;">Sorted by proximity:</p>
            
            <select id="driverSelect" class="form-select">
                <option value="">-- Loading Drivers --</option>
            </select>

            <div class="debug-tools">
                <strong>🛠️ Troubleshooting</strong>
                <p style="font-size:0.8rem; margin:5px 0;">If drivers are stuck 'Busy':</p>
                <button class="btn-danger-sm" onclick="forceClearAllAssignments()">Force Clear All Trips</button>
            </div>

            <button class="btn-assign w-100 py-3" onclick="submitAssignment()" style="margin-top:10px;">Confirm Assignment</button>
        </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script type="module">
        // 1. IMPORTS (Unified)
        import { supabase, formatCurrency } from '../assets/js/config.js';
        import { loadDynamicSidebar } from '../assets/js/sidebar-loader.js'; // <-- CRITICAL IMPORT HERE

        // --- STATE MANAGEMENT ---
        let currentUserId = null;
        let allBookingsCache = []; 
        let activeFilter = 'incoming'; 
        
        // Auto Dispatch State
        let autoDispatchInterval = null;
        let isAutoDispatchActive = false;
        let currentBookingIdForAssign = null;
        let currentPickupCoordsForAssign = null;

        // DOM Elements
        const globalLoader = document.getElementById('globalLoader');
        const searchInput = document.getElementById('searchInput');
        const tabButtons = document.querySelectorAll('.nav-pill-btn');
        
        // Containers
        const incomingListContainer = document.getElementById('incomingListContainer');
        const activeListContainer = document.getElementById('activeListContainer');
        const issuesListContainer = document.getElementById('issuesListContainer');
        
        // Counters
        const countIncomingEl = document.getElementById('count-incoming');
        const countActiveEl = document.getElementById('count-active');
        const countIssuesEl = document.getElementById('count-issues');

        // Controls
        const autoToggle = document.getElementById('autoDispatchToggle');
        const assignModal = document.getElementById('assignModal');
        const driverSelect = document.getElementById('driverSelect');

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                showLoading(true);
                
                // Step A: Auth Check
                await checkAuth();
                
                // Step B: Load Sidebar FIRST (Lightweight DB call)
                // This ensures the menu appears quickly even if trip data is slow
                await loadDynamicSidebar('dynamicNavList', 'admin');
                
                // Step C: Restore Local Settings
                restoreAutoDispatchState();
                
                // Step D: Setup UI Listeners
                setupEventListeners();
                
                // Step E: Fetch Heavy Trip Data
                await refreshAllData();
                
                // Step F: Start Daemon if enabled
                if (isAutoDispatchActive) {
                    startAutoDispatchDaemon();
                }

            } catch (err) {
                console.error("Init Error:", err);
                alert("Initialization failed: " + err.message);
            } finally {
                showLoading(false);
            }
        });

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = '/pahatid-system-project/login.html'; return; }
            currentUserId = session.user.id;
            const { data: profile } = await supabase.from('profiles').select('role').eq('id', currentUserId).single();
            if (profile.role !== 'admin' && profile.role !== 'dispatcher') { 
                alert("Access Denied."); 
                window.location.href = '/pahatid-system-project/index.html'; 
            }
        }

        function restoreAutoDispatchState() {
            const savedState = localStorage.getItem('pahatid_auto_dispatch_enabled');
            const initialState = savedState === null ? true : savedState === 'true';
            
            if(autoToggle) {
                autoToggle.checked = initialState;
                isAutoDispatchActive = initialState;
            }
        }

        /**
         * UNIFIED DATA FETCHER
         */
        async function refreshAllData() {
            try {
                // Note: We don't show full screen loader here anymore to avoid flickering
                // since init already showed it. Just update lists.
                
                const statusesToFetch = [
                    'requested',              
                    'accepted',               
                    'arrived_pickup',         
                    'in_progress',            
                    'cancellation_requested'  
                ];

                const { data: rawBookings, error } = await supabase
                    .from('bookings')
                    .select(`
                        *,
                        commuter_profiles:profiles!bookings_commuter_profile_id_fkey(full_name, phone_number),
                        driver_profiles:profiles!bookings_driver_profile_id_fkey(full_name, id)
                    `)
                    .in('trip_status', statusesToFetch)
                    .order('created_at', { ascending: false })
                    .limit(100);

                if (error) throw error;

                if (!rawBookings || rawBookings.length === 0) {
                    renderEmptyStates();
                    updateCounts(0, 0, 0);
                    return;
                }

                allBookingsCache = rawBookings.map(b => ({
                    ...b,
                    commuterName: b.commuter_profiles?.full_name || 'Unknown Passenger',
                    commuterPhone: b.commuter_profiles?.phone_number || '-',
                    driverName: b.driver_profiles?.full_name || 'Unassigned',
                    driverUuid: b.driver_profiles?.id || null
                }));

                const incomingTrips = allBookingsCache.filter(t => t.trip_status === 'requested');
                const activeTrips = allBookingsCache.filter(t => ['accepted', 'arrived_pickup', 'in_progress'].includes(t.trip_status));
                const issueTrips = allBookingsCache.filter(t => t.trip_status === 'cancellation_requested');

                renderSection(incomingListContainer, incomingTrips, 'incoming');
                renderSection(activeListContainer, activeTrips, 'active');
                renderSection(issuesListContainer, issueTrips, 'issues');

                updateCounts(incomingTrips.length, activeTrips.length, issueTrips.length);
                
                applySearchFilter();

            } catch (err) {
                console.error(err);
                renderErrorState(err.message);
            }
        }

        function updateCounts(incoming, active, issues) {
            countIncomingEl.textContent = incoming;
            countActiveEl.textContent = active;
            countIssuesEl.textContent = issues;
        }

        function renderEmptyStates() {
            const emptyHtml = `<div class="empty-state-mobile"><i class="fas fa-inbox"></i><p>No records found.</p></div>`;
            incomingListContainer.innerHTML = emptyHtml;
            activeListContainer.innerHTML = emptyHtml;
            issuesListContainer.innerHTML = emptyHtml;
        }

        function renderErrorState(msg) {
            const errHtml = `<div class="empty-state-mobile text-danger"><i class="fas fa-exclamation-triangle"></i><p>Error: ${msg}</p></div>`;
            incomingListContainer.innerHTML = errHtml;
            activeListContainer.innerHTML = errHtml;
            issuesListContainer.innerHTML = errHtml;
        }

        function showLoading(show) {
            if(show) globalLoader.classList.add('active');
            else globalLoader.classList.remove('active');
        }

        // --- RENDERING LOGIC ---

        function renderSection(container, trips, type) {
            if (!trips.length) {
                container.innerHTML = `<div class="empty-state-mobile"><i class="fas ${type==='issues'?'fa-check-circle':'fa-inbox'}"></i><p>No ${type} items.</p></div>`;
                return;
            }

            container.innerHTML = trips.map(t => createCard(t, type)).join('');
        }

        function createCard(t, type) {
            let borderClass = '';
            let chipClass = '';
            let statusText = '';
            let actionsHtml = '';

            const timeStr = new Date(t.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            const pickupAddr = t.pickup_address ? t.pickup_address.substring(0, 20) + '...' : 'N/A';
            const dropoffAddr = t.dropoff_address ? t.dropoff_address.substring(0, 20) + '...' : 'N/A';
            const fareStr = formatCurrency(t.final_fare);

            if (type === 'incoming') {
                borderClass = 'card-border-new';
                chipClass = 'chip-new';
                statusText = 'WAITING DRIVER';
                actionsHtml = `
                    <button class="btn-mobile-action btn-assign" onclick="openAssignModal('${t.booking_id}', ${t.pickup_lat}, ${t.pickup_lng})">
                        <i class="fas fa-user-plus"></i> Assign Driver
                    </button>
                `;
            } else if (type === 'active') {
                if (t.trip_status === 'in_progress') {
                    borderClass = 'card-border-progress';
                    chipClass = 'chip-progress';
                    statusText = 'IN PROGRESS';
                } else {
                    borderClass = 'card-border-waiting';
                    chipClass = 'chip-waiting';
                    statusText = t.trip_status === 'arrived_pickup' ? 'ARRIVED' : 'ACCEPTED';
                }
                
                const trackBtn = t.driverUuid ? `
                    <a href="driver-tracker.html?id=${t.driverUuid}" target="_blank" class="btn-mobile-action btn-track">
                        <i class="fas fa-location-crosshairs"></i> Track
                    </a>` : '';

                actionsHtml = `
                    ${trackBtn}
                    <button class="btn-mobile-action btn-force-cancel" onclick="forceCancel('${t.booking_id}')">
                        <i class="fas fa-times-circle"></i> Force End
                    </button>
                `;
            } else if (type === 'issues') {
                borderClass = 'card-border-cancel';
                chipClass = 'chip-cancel';
                statusText = 'CANCEL REQ.';
                actionsHtml = `
                    <button class="btn-mobile-action btn-approve" onclick="handleApproval('${t.booking_id}', true)">
                        <i class="fas fa-check"></i> Approve
                    </button>
                    <button class="btn-mobile-action btn-reject" onclick="handleApproval('${t.booking_id}', false)">
                        <i class="fas fa-ban"></i> Reject
                    </button>
                `;
            }

            const reasonBox = (type === 'issues') ? 
                `<div class="route-preview" style="background:#fff5f5; border:1px dashed #ef4444; padding:8px; border-radius:6px; color:#b91c1c; font-size:0.85rem; margin-bottom:1rem;">
                    <strong>Reason:</strong> ${t.cancellation_reason_text || 'Not specified'}
                </div>` : '';

            return `
            <div class="mobile-card ${borderClass}">
                <div class="card-body-mobile">
                    <div class="card-top-row">
                        <span class="ref-code-text">#${t.reference_code}</span>
                        <span class="status-chip ${chipClass}">${statusText}</span>
                    </div>

                    <div class="parties-info-grid">
                        <div class="party-item">
                            <span class="party-label">Passenger</span>
                            <span class="party-name">${t.commuterName}</span>
                            <small class="text-muted">${t.commuterPhone}</small>
                        </div>
                        <div class="party-item">
                            <span class="party-label">Driver</span>
                            <span class="party-name">${t.driverName}</span>
                        </div>
                    </div>

                    <div class="route-preview">
                        <div class="route-point">
                            <i class="fas fa-circle text-success route-icon"></i>
                            <span>${pickupAddr}</span>
                        </div>
                        <div class="route-point">
                            <i class="fas fa-flag-checkered text-danger route-icon"></i>
                            <span>${dropoffAddr}</span>
                        </div>
                        <div class="d-flex justify-content-between mt-2 small text-muted">
                            <span><i class="far fa-clock me-1"></i> ${timeStr}</span>
                            <span><strong>${fareStr}</strong></span>
                        </div>
                    </div>

                    ${reasonBox}
                    
                    <div class="action-buttons-group">
                        ${actionsHtml}
                    </div>
                </div>
            </div>
            `;
        }

        // --- FILTERING & SEARCH ---

        function applySearchFilter() {
            const term = searchInput.value.toLowerCase().trim();
            
            const filteredIncoming = allBookingsCache.filter(t => t.trip_status === 'requested' && matchesSearch(t, term));
            const filteredActive = allBookingsCache.filter(t => ['accepted', 'arrived_pickup', 'in_progress'].includes(t.trip_status) && matchesSearch(t, term));
            const filteredIssues = allBookingsCache.filter(t => t.trip_status === 'cancellation_requested' && matchesSearch(t, term));

            renderSection(incomingListContainer, filteredIncoming, 'incoming');
            renderSection(activeListContainer, filteredActive, 'active');
            renderSection(issuesListContainer, filteredIssues, 'issues');
        }

        function matchesSearch(trip, term) {
            if (!term) return true;
            return trip.reference_code.toLowerCase().includes(term) || 
                   trip.commuterName.toLowerCase().includes(term) ||
                   trip.driverName.toLowerCase().includes(term);
        }

        // --- ACTIONS ---

        /**
         * CRITICAL FIX: Aligned with Verified Schema Columns.
         */
        window.handleApproval = async function(id, approved) {
            const actionText = approved ? "APPROVE" : "REJECT";
            if(!confirm(`Are you sure you want to ${actionText} this cancellation request?`)) return;
            
            try {
                showLoading(true);
                
                let updates = {};
                
                if (approved) {
                    updates = { 
                        trip_status: 'cancelled', 
                        driver_profile_id: null, 
                        cancelled_at: new Date().toISOString(),
                        cancelled_by_role: 'admin_approved' 
                    };
                } else {
                    updates = { 
                        trip_status: 'accepted' 
                    };
                }

                const { error } = await supabase.from('bookings').update(updates).eq('booking_id', id);
                if(error) throw error;
                
                alert(`✅ Request ${actionText}d.`);
                await refreshAllData();
            } catch(e) { 
                alert("❌ Error: " + e.message);
                showLoading(false);
            }
        };

        window.forceCancel = async function(id) {
             if(!confirm("Force Cancel this ride immediately?")) return;
             try {
                showLoading(true);
                const { error } = await supabase.from('bookings').update({ 
                    trip_status: 'cancelled', 
                    driver_profile_id: null,
                    cancelled_at: new Date().toISOString(),
                    cancelled_by_role: 'admin_force' 
                }).eq('booking_id', id);
                if(error) throw error;
                alert("✅ Ride Cancelled.");
                await refreshAllData();
            } catch(e) { 
                alert("❌ Error: " + e.message);
                showLoading(false);
            }
        };

        // --- ASSIGNMENT MODAL LOGIC ---

        window.openAssignModal = async function(bookingId, pickupLat, pickupLng) {
            currentBookingIdForAssign = bookingId;
            currentPickupCoordsForAssign = { lat: parseFloat(pickupLat), lng: parseFloat(pickupLng) };
            
            assignModal.style.display = 'flex';
            driverSelect.innerHTML = '<option value="">Fetching Drivers...</option>';
            
            try {
                const { data: rawDrivers, error: drvErr } = await supabase
                    .from('drivers')
                    .select('user_profile_id, employment_type, current_latitude, current_longitude')
                    .eq('is_online', true);

                if (drvErr) throw drvErr;
                if (!rawDrivers || rawDrivers.length === 0) {
                    driverSelect.innerHTML = '<option value="">NO ONLINE DRIVERS FOUND</option>';
                    return;
                }

                const driverIds = rawDrivers.map(d => d.user_profile_id);
                const { data: profiles, error: profErr } = await supabase
                    .from('profiles')
                    .select('id, full_name')
                    .in('id', driverIds);
                
                const nameMap = {};
                if (profiles) profiles.forEach(p => nameMap[p.id] = p.full_name);

                const allOnlineDrivers = rawDrivers.map(d => ({
                    ...d,
                    full_name: nameMap[d.user_profile_id] || 'Unknown Driver'
                }));

                const { data: activeBookings, error: actErr } = await supabase
                    .from('bookings')
                    .select('driver_profile_id')
                    .in('driver_profile_id', driverIds)
                    .in('trip_status', ['accepted', 'arrived_pickup', 'in_progress']);
                
                const busyDriverIds = new Set((activeBookings || []).map(b => b.driver_profile_id));

                let optionsHtml = '';
                
                const availableDrivers = allOnlineDrivers.filter(d => !busyDriverIds.has(d.user_profile_id));
                
                const sortedAvailable = availableDrivers.map(d => {
                    let dist = Infinity;
                    if (d.current_latitude && d.current_longitude) {
                         dist = getDistanceFromLatLonInKm(
                            currentPickupCoordsForAssign.lat, 
                            currentPickupCoordsForAssign.lng, 
                            d.current_latitude, 
                            d.current_longitude
                        );
                    }
                    return { ...d, distance_km: dist };
                }).sort((a,b) => a.distance_km - b.distance_km);

                if (sortedAvailable.length > 0) {
                    optionsHtml += '<optgroup label="✅ Available Drivers">';
                    optionsHtml += sortedAvailable.slice(0, 10).map(d => {
                        const distText = d.distance_km === Infinity ? "Loc Unknown" : 
                                         (d.distance_km < 1 ? `${(d.distance_km * 1000).toFixed(0)} m` : `${d.distance_km.toFixed(1)} km`);
                        
                        const empBadge = d.employment_type === 'hired' 
                            ? '<span class="badge bg-warning text-dark ms-1" style="font-size:0.6rem;">HIRED</span>' 
                            : '<span class="badge bg-info text-white ms-1" style="font-size:0.6rem;">FREE</span>';

                        return `
                            <option value="${d.user_profile_id}" data-type="${d.employment_type}">
                                ${d.full_name} ${empBadge} (${distText})
                            </option>
                        `;
                    }).join('');
                    optionsHtml += '</optgroup>';
                }

                const busyDrivers = allOnlineDrivers.filter(d => busyDriverIds.has(d.user_profile_id));
                if (busyDrivers.length > 0) {
                    optionsHtml += '<optgroup label="⛔ Currently On Trip">';
                    optionsHtml += busyDrivers.map(d => {
                        return `<option value="" disabled>${d.full_name} (BUSY)</option>`;
                    }).join('');
                    optionsHtml += '</optgroup>';
                }

                driverSelect.innerHTML = '<option value="">-- Select Driver --</option>' + optionsHtml;

            } catch (err) {
                console.error(err);
                driverSelect.innerHTML = `<option value="">Error: ${err.message}</option>`;
            }
        };

        window.closeAssignModal = function() {
            assignModal.style.display = 'none';
            currentBookingIdForAssign = null;
            currentPickupCoordsForAssign = null;
        };

        window.submitAssignment = async function() {
            const selectedOption = driverSelect.options[driverSelect.selectedIndex];
            const selectedDriverId = selectedOption.value;
            const driverType = selectedOption.getAttribute('data-type');

            if (!selectedDriverId || !currentBookingIdForAssign) {
                alert("Please select a driver.");
                return;
            }

            if(driverType === 'hired') {
                 if(!confirm("This is a HIRED driver. Proceed?")) return;
            }

            try {
                const { error } = await supabase
                    .from('bookings')
                    .update({ 
                        driver_profile_id: selectedDriverId,
                        trip_status: 'accepted'
                    })
                    .eq('booking_id', currentBookingIdForAssign);

                if (error) throw error;

                alert("Driver Assigned Successfully!");
                closeAssignModal();
                await refreshAllData(); 

            } catch (err) {
                alert("Assignment failed: " + err.message);
            }
        };

        window.forceClearAllAssignments = async function() {
            if(!confirm("WARNING: Unassign ALL active trips?")) return;
            try {
                const { error } = await supabase
                    .from('bookings')
                    .update({
                        driver_profile_id: null,
                        trip_status: 'requested'
                    })
                    .in('trip_status', ['accepted', 'arrived_pickup', 'in_progress']);

                if (error) throw error;
                alert("✅ Cleared.");
                closeAssignModal();
                await refreshAllData();
            } catch (err) {
                alert("❌ Failed: " + err.message);
            }
        };

        // --- AUTO DISPATCH DAEMON ---

        function startAutoDispatchDaemon() {
            if (autoDispatchInterval) clearInterval(autoDispatchInterval);
            runAutoDispatchCycle(); 
            autoDispatchInterval = setInterval(runAutoDispatchCycle, 20000); 
            console.log("🤖 Auto-Dispatch Daemon Started");
        }

        function stopAutoDispatchDaemon() {
            if (autoDispatchInterval) {
                clearInterval(autoDispatchInterval);
                autoDispatchInterval = null;
                console.log("🛑 Auto-Dispatch Daemon Stopped");
            }
        }

        async function runAutoDispatchCycle() {
            if (!supabase || !isAutoDispatchActive) return;

            try {
                const { data: pendingOrders, error: ordErr } = await supabase
                    .from('bookings')
                    .select('booking_id, pickup_lat, pickup_lng')
                    .eq('trip_status', 'requested')
                    .not('commuter_profile_id', 'is', null);

                if (ordErr || !pendingOrders || pendingOrders.length === 0) return;

                const { data: onlineDriversRaw, error: drvErr } = await supabase
                    .from('drivers')
                    .select('user_profile_id, current_latitude, current_longitude')
                    .eq('is_online', true)
                    .not('current_latitude', 'is', null)
                    .not('current_longitude', 'is', null);

                if (drvErr || !onlineDriversRaw || onlineDriversRaw.length === 0) return;

                const driverIds = onlineDriversRaw.map(d => d.user_profile_id);
                const { data: activeBookings, error: actErr } = await supabase
                    .from('bookings')
                    .select('driver_profile_id')
                    .in('driver_profile_id', driverIds)
                    .in('trip_status', ['accepted', 'arrived_pickup', 'in_progress']);
                
                if (actErr) return;

                const busyDriverIds = new Set((activeBookings || []).map(b => b.driver_profile_id));
                const availableDrivers = onlineDriversRaw.filter(d => !busyDriverIds.has(d.user_profile_id));

                if (availableDrivers.length === 0) return;

                const assignedInThisCycle = new Set();

                for (const order of pendingOrders) {
                    const oLat = parseFloat(order.pickup_lat);
                    const oLng = parseFloat(order.pickup_lng);
                    if (isNaN(oLat) || isNaN(oLng)) continue;

                    let bestDriver = null;
                    let minDist = Infinity;

                    for (const driver of availableDrivers) {
                        if (assignedInThisCycle.has(driver.user_profile_id)) continue;
                        const dLat = parseFloat(driver.current_latitude);
                        const dLng = parseFloat(driver.current_longitude);
                        if (isNaN(dLat) || isNaN(dLng)) continue;

                        const dist = getDistanceFromLatLonInKm(oLat, oLng, dLat, dLng);
                        if (dist < minDist) {
                            minDist = dist;
                            bestDriver = driver;
                        }
                    }

                    if (bestDriver) {
                        const { error: updErr } = await supabase
                            .from('bookings')
                            .update({
                                driver_profile_id: bestDriver.user_profile_id,
                                trip_status: 'accepted'
                            })
                            .eq('booking_id', order.booking_id);

                        if (!updErr) {
                            assignedInThisCycle.add(bestDriver.user_profile_id);
                        }
                    }
                }

                if (assignedInThisCycle.size > 0) {
                    await refreshAllData(); 
                }

            } catch (err) {
                console.error("Auto-Dispatch Cycle Error:", err);
            }
        }

        // --- UTILS ---
        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            var R = 6371; 
            var dLat = deg2rad(lat2-lat1);
            var dLon = deg2rad(lon2-lon1); 
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * 
                    Math.sin(dLon/2) * Math.sin(dLon/2); 
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
            return R * c;
        }
        function deg2rad(deg) { return deg * (Math.PI/180); }

        // --- EVENT LISTENERS SETUP ---
        function setupEventListeners() {
            // Sidebar
            const menuToggleBtn = document.getElementById('menuToggleBtn');
            const globalSidebar = document.getElementById('globalSidebar');
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            function toggleSidebar() { globalSidebar.classList.toggle('open'); sidebarOverlay.classList.toggle('active'); }
            if(menuToggleBtn) menuToggleBtn.addEventListener('click', toggleSidebar);
            if(sidebarOverlay) sidebarOverlay.addEventListener('click', () => { globalSidebar.classList.remove('open'); sidebarOverlay.classList.remove('active'); });
            
            // Logout (Handled by sidebar-loader now, but keeping fallback if needed)
            // Removed manual listener here to prevent conflicts with dynamic loader
            
            // Tab Switching
            tabButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    tabButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    const tabId = btn.dataset.tab;
                    document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
                    document.getElementById(`section-${tabId}`).classList.add('active');
                    
                    // Show/Hide Auto Control based on tab
                    const autoCtrl = document.getElementById('autoDispatchControlContainer');
                    if(tabId === 'incoming') autoCtrl.classList.remove('d-none');
                    else autoCtrl.classList.add('d-none');
                });
            });

            // Search Debounce
            let searchTimeout;
            searchInput.addEventListener('input', () => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    applySearchFilter();
                }, 300);
            });

            // Auto Dispatch Toggle
            if(autoToggle) {
                autoToggle.addEventListener('change', (e) => {
                    isAutoDispatchActive = e.target.checked;
                    localStorage.setItem('pahatid_auto_dispatch_enabled', isAutoDispatchActive.toString());
                    
                    if (isAutoDispatchActive) {
                        startAutoDispatchDaemon();
                    } else {
                        stopAutoDispatchDaemon();
                    }
                });
            }
        }

        window.refreshAllData = refreshAllData;
        window.addEventListener('beforeunload', () => {
            stopAutoDispatchDaemon();
        });

    </script>
