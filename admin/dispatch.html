<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Dispatch | Pahatid Admin</title>
    
    <!-- CSS Libraries (Identical to Working Track-Order Page) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="../assets/css/style.css">
    
    <style>
        /* --- LAYOUT CONTAINER (Grid Split) --- */
        .dispatch-layout {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 60px); 
            position: relative;
            z-index: 1;
        }
        @media (min-width: 992px) {
            .dispatch-layout {
                flex-direction: row;
            }
        }

        /* --- MAP AREA --- */
        #map-container {
            flex-grow: 1;
            min-height: 400px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            position: relative; 
            z-index: 1;
        }

        /* Loader Overlay for Map */
        .map-loader-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.8);
            z-index: 10;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .map-loader-overlay.active { display: flex; }
        .loader-spinner-small {
            width: 2rem; height: 2rem;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--pahatid-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- INFO PANEL (LEFT SIDE ON DESKTOP, BOTTOM ON MOBILE) --- */
        .info-panel {
            background: white;
            padding: 1.5rem;
            border-bottom-left-radius: var(--radius-lg);
            border-bottom-right-radius: var(--radius-lg);
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
            
            position: relative; 
            z-index: 2; 
            
            max-height: 50vh;
            overflow-y: auto;
            
            transition: transform 0.3s ease;
        }
        
        @media (min-width: 992px) {
            .info-panel {
                width: 350px;
                border-radius: var(--radius-lg) 0 0 var(--radius-lg);
                height: 100%;
                box-shadow: none;
                border-right: 1px solid #eee;
                z-index: 1;
            }
        }

        /* --- DRIVER MARKERS STYLES --- */
        .driver-marker-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
            cursor: pointer;
            color: white;
            border: 2px solid white;
        }
        .marker-available { background: #198754 !important; } /* Green */
        .marker-busy { background: #dc3545 !important; opacity: 0.6; } /* Red/Faded */

        /* --- REQUEST CARDS --- */
        .request-card {
            border-left: 4px solid var(--pahatid-warning);
            transition: all 0.2s;
            margin-bottom: 1rem;
            cursor: pointer;
        }
        .request-card:hover {
            transform: translateX(5px);
            box-shadow: var(--shadow-md);
            border-left-color: var(--pahatid-primary);
        }
        .request-card.selected {
            background: #eff6ff;
            border-left-color: var(--pahatid-primary);
        }

        /* --- SIDEBAR Z-INDEX SAFETY NET --- */
        body.sidebar-open .sidebar { z-index: 2000 !important; }
        body.sidebar-open .sidebar-overlay { z-index: 1999 !important; display: block !important; opacity: 1 !important; }
        @media (max-width: 991px) {
            body.sidebar-open .info-panel { pointer-events: none; filter: blur(2px); }
        }
    </style>
</head>
<body>

    <!-- Mobile Menu Toggle Button -->
    <button class="mobile-menu-toggle" id="menuToggleBtn" aria-label="Toggle Navigation">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-wrapper">
        
        <!-- GLOBAL SIDEBAR NAVIGATION (Admin Context) -->
        <aside class="sidebar" id="globalSidebar">
            <div class="sidebar-header">
                <a href="/pahatid-system-project/" class="sidebar-brand">
                    <i class="fas fa-shield-alt text-warning"></i> Pahatid<span class="text-white fw-normal ms-1">Admin</span>
                </a>
            </div>
            
            <ul class="sidebar-nav">
                <li><a href="dashboard.html" class="sidebar-link"><i class="fas fa-tachometer-alt me-2"></i> Dashboard</a></li>
                <li><a href="#" class="sidebar-link active"><i class="fas fa-map-marked-alt me-2"></i> Live Dispatch</a></li>
                
                <li class="sidebar-section-title">Management</li>
                <li><a href="drivers.html" class="sidebar-link"><i class="fas fa-users me-2"></i> Manage Drivers</a></li>
                <li><a href="commuters.html" class="sidebar-link"><i class="fas fa-user-friends me-2"></i> Manage Commuters</a></li>
                
                <li class="sidebar-section-title">System</li>
                <li><a href="#" id="logoutBtn" class="sidebar-link text-danger mt-3"><i class="fas fa-sign-out-alt me-2"></i> Logout</a></li>
            </ul>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="main-content p-0 d-flex flex-column vh-100">
            
            <!-- Header Bar -->
            <header class="p-3 bg-white border-bottom d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="mb-0 fw-bold"><i class="fas fa-satellite-dish me-2 text-info"></i> Live Dispatch</h5>
                    <small class="text-muted">Monitor & Assign Orders</small>
                </div>
                <div class="d-flex gap-2 small">
                    <span class="badge bg-success rounded-pill"><i class="fas fa-motorcycle me-1"></i> Avail: <span id="availCount">0</span></span>
                    <span class="badge bg-danger rounded-pill"><i class="fas fa-clock me-1"></i> Busy: <span id="busyCount">0</span></span>
                </div>
            </header>

            <div class="dispatch-layout">
                
                <!-- LEFT/PANEL: Incoming Requests List -->
                <div class="info-panel" id="requestsPanel">
                    <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
                        <h6 class="fw-bold mb-0 text-primary"><i class="fas fa-inbox me-2"></i> Pending Orders</h6>
                        <span class="badge bg-secondary rounded-pill" id="pendingBadge">0</span>
                    </div>
                    
                    <div id="requestsContainer">
                        <!-- Populated by JS -->
                        <div class="text-center py-5 text-muted">
                            <div class="spinner-border text-primary mb-3" role="status"></div>
                            <p>Loading orders...</p>
                        </div>
                    </div>
                </div>

                <!-- RIGHT/MAP: Live View -->
                <div id="map-container">
                    <!-- Loader Overlay INSIDE MAP CONTAINER -->
                    <div class="map-loader-overlay" id="mapLoaderOverlay">
                        <div class="loader-spinner-small"></div>
                        <p class="small mt-2 text-muted">Updating Driver Positions...</p>
                    </div>
                </div>

            </div>

        </main>
    </div>

    <!-- Scripts (CORRECTED URLs WITH @ SYMBOLS - SAME AS TRACK ORDER) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script type="module">
        import { supabase, formatCurrency } from '../assets/js/config.js';

        // --- STATE MANAGEMENT ---
        let mapInstance = null;
        let driverMarkers = {}; // Store markers by user_profile_id
        let pendingRequests = [];
        let selectedRequestId = null;
        let realtimeChannel = null;
        let globalAvailableDrivers = []; 

        // DOM Elements
        const requestsContainer = document.getElementById('requestsContainer');
        const pendingBadge = document.getElementById('pendingBadge');
        const availCountEl = document.getElementById('availCount');
        const busyCountEl = document.getElementById('busyCount');
        const mapLoaderOverlay = document.getElementById('mapLoaderOverlay');

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', async () => {
            console.log("🚀 Initializing Dispatch Page...");
            
            await checkAuth();
            initMap();
            loadInitialData();
            subscribeToRealtime();
            setupEventListeners();
        });

        async function checkAuth() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) {
                    window.location.href = '/pahatid-system-project/login.html';
                    return;
                }
                
                const { data: profile } = await supabase.from('profiles').select('role').eq('id', session.user.id).single();
                if (profile.role !== 'admin' && profile.role !== 'dispatcher') {
                    alert("Access Denied.");
                    window.location.href = '/pahatid-system-project/index.html';
                }
                console.log("✅ Authenticated User:", session.user.id);
            } catch (err) {
                console.error("Auth Check Failed:", err);
                alert("Authentication Error.");
            }
        }

        function initMap() {
            if(typeof L === 'undefined') {
                console.error("Leaflet JS failed to load!");
                return;
            }
            // Center on Manila
            mapInstance = L.map('map-container').setView([14.5995, 120.9842], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(mapInstance);
        }

        // --- LOAD INITIAL DATA ---
        async function loadInitialData() {
            try {
                console.group("📡 Loading Dispatch Data");

                // 1. FETCH ALL ONLINE DRIVERS
                if(mapLoaderOverlay) mapLoaderOverlay.classList.add('active');
                
                const { data: driversRaw, error: dErr } = await supabase
                    .from('drivers')
                    .select(`
                        *,
                        profiles!drivers_user_profile_id_fkey(full_name, phone_number)
                    `)
                    .eq('is_online', true);

                if (dErr) throw new Error("Driver Fetch Fail: " + dErr.message);
                
                console.log(`Found ${driversRaw?.length || 0} online drivers.`);

                let availableDrivers = [];
                let busyDrivers = [];

                if (driversRaw && driversRaw.length > 0) {
                    // 2. IDENTIFY BUSY DRIVERS
                    const driverIds = driversRaw.map(d => d.user_profile_id);
                    
                    const { data: activeBookings, error: bErr } = await supabase
                        .from('bookings')
                        .select('driver_profile_id')
                        .in('driver_profile_id', driverIds)
                        .in('trip_status', ['accepted', 'arrived_pickup', 'in_progress']);
                    
                    if (bErr) {
                         console.warn("Busy Check Warning:", bErr);
                         availableDrivers = driversRaw;
                    } else {
                        const busyDriverIds = new Set((activeBookings || []).map(b => b.driver_profile_id));
                        availableDrivers = driversRaw.filter(d => !busyDriverIds.has(d.user_profile_id));
                        busyDrivers = driversRaw.filter(d => busyDriverIds.has(d.user_profile_id));
                    }
                }

                globalAvailableDrivers = availableDrivers;
                renderDriversOnMap(availableDrivers, busyDrivers);
                updateStats(availableDrivers, busyDrivers);

                // 3. FETCH PENDING BOOKINGS
                const { data: rawBookings, error: reqErr } = await supabase
                    .from('bookings')
                    .select(`
                        *,
                        profiles:commuter_profile_id(full_name, phone_number)
                    `)
                    .eq('trip_status', 'requested')
                    .eq('is_manual_log', false)
                    .not('commuter_profile_id', 'is', null)
                    .order('created_at', { ascending: false });

                if (reqErr) throw new Error("Booking Fetch Fail: " + reqErr.message);

                console.log(`Found ${rawBookings?.length || 0} requests.`);
                renderRequestsList(rawBookings || []);
                
                console.groupEnd();

            } catch (err) {
                console.error(err);
                alertsError("Failed to load data: " + err.message);
                if(requestsContainer) {
                    requestsContainer.innerHTML = `<div class="alert alert-danger m-2">${err.message}</div>`;
                }
            } finally {
                if(mapLoaderOverlay) mapLoaderOverlay.classList.remove('active');
            }
        }

        // --- RENDERING LOGIC ---

        function renderDriversOnMap(available, busy) {
            Object.values(driverMarkers).forEach(marker => mapInstance.removeLayer(marker));
            driverMarkers = {};

            available.forEach(driver => {
                const lat = driver.current_latitude || 14.5995; 
                const lng = driver.current_longitude || 120.9842;

                const marker = L.marker([lat, lng], {
                    icon: L.divIcon({
                        className: 'custom-driver-marker',
                        html: `<div class="driver-marker-icon marker-available"><i class="fas fa-motorcycle"></i></div>`,
                        iconSize: [24, 24]
                    })
                }).addTo(mapInstance);

                marker.bindPopup(`
                    <strong>${driver.profiles.full_name}</strong><br>
                    Rank: ${driver.current_rank}<br>
                    Type: ${(driver.employment_type || 'freelance').toUpperCase()}<br>
                    <small class="text-success fw-bold">AVAILABLE</small>
                `);

                driverMarkers[driver.user_profile_id] = marker;
            });

            busy.forEach(driver => {
                const lat = driver.current_latitude || 14.5995; 
                const lng = driver.current_longitude || 120.9842;

                const marker = L.marker([lat, lng], {
                    icon: L.divIcon({
                        className: 'custom-driver-marker',
                        html: `<div class="driver-marker-icon marker-busy"><i class="fas fa-motorcycle"></i></div>`,
                        iconSize: [24, 24]
                    })
                }).addTo(mapInstance);

                marker.bindPopup(`
                    <strong>${driver.profiles.full_name}</strong><br>
                    <small class="text-danger fw-bold">BUSY (In Trip)</small>
                `);

                driverMarkers[driver.user_profile_id] = marker;
            });
        }

        function renderRequestsList(bookings) {
            pendingRequests = bookings;
            pendingBadge.textContent = bookings.length;

            if (bookings.length === 0) {
                requestsContainer.innerHTML = '<div class="text-center py-4 text-muted"><i class="fas fa-check-circle text-success fa-2x mb-2"></i><br>No pending orders.</div>';
                return;
            }

            requestsContainer.innerHTML = bookings.map(req => `
                <div class="card request-card shadow-sm border-0" onclick="selectRequest('${req.booking_id}')">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h6 class="fw-bold mb-0">${req.profiles?.full_name || 'Unknown'}</h6>
                            <small class="text-muted">${new Date(req.created_at).toLocaleTimeString()}</small>
                        </div>
                        <div class="small text-muted mb-2">
                            <i class="fas fa-map-pin text-success me-1"></i> ${req.pickup_address ? req.pickup_address.substring(0, 20) : 'N/A'}...<br>
                            <i class="fas fa-flag-checkered text-danger me-1"></i> ${req.dropoff_address ? req.dropoff_address.substring(0, 20) : 'N/A'}...
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
                            <strong class="text-primary">${formatCurrency(req.final_fare)}</strong>
                            <button class="btn btn-sm btn-primary assign-btn" onclick="event.stopPropagation(); openAssignment('${req.booking_id}')">
                                Assign
                            </button>
                        </div>
                    </div>
                </div>
            ).join('');
        }

        function updateStats(available, busy) {
            availCountEl.textContent = available.length;
            busyCountEl.textContent = busy.length;
        }

        // --- INTERACTION LOGIC ---

        window.selectRequest = function(requestId) {
            selectedRequestId = requestId;
            // Highlight card
            document.querySelectorAll('.request-card').forEach(el => el.classList.remove('selected'));
            const targetCard = Array.from(document.querySelectorAll('.request-card')).find(card => card.getAttribute('onclick').includes(requestId));
            if(targetCard) targetCard.classList.add('selected');
            
            // Pan map to pickup location
            const req = pendingRequests.find(r => r.booking_id == requestId);
            if(req && req.pickup_lat && req.pickup_lng) {
                mapInstance.setView([parseFloat(req.pickup_lat), parseFloat(req.pickup_lng)], 15);
            }
        };

        window.openAssignment = function(requestId) {
            selectedRequestId = requestId;
            const req = pendingRequests.find(r => r.booking_id == requestId);
            if(!req) return;

            const pickupLat = parseFloat(req.pickup_lat);
            const pickupLng = parseFloat(req.pickup_lng);

            fetchNearbyAvailableDriversAndShowModal(pickupLat, pickupLng);
        };

        async function fetchNearbyAvailableDriversAndShowModal(lat, lng) {
            if(globalAvailableDrivers.length === 0) {
                 // Create a temporary modal or alert since we don't have a dedicated modal HTML in this simplified build
                 alert("No available drivers found near this location.");
                 return;
            }

            const driversWithDist = globalAvailableDrivers.map(d => {
                const dLat = d.current_latitude || lat; 
                const dLng = d.current_longitude || lng;
                const dist = getDistanceFromLatLonInKm(lat, lng, dLat, dLng);
                return { ...d, distance: dist };
            }).sort((a,b) => a.distance - b.distance);

            // For simplicity in this rebuild, we'll use a browser prompt or confirm loop 
            // In production, you'd want a proper Bootstrap Modal here.
            // Let's simulate the selection with a simple list rendering into an alert-like behavior using console and UI feedback.
            
            const nearest = driversWithDist[0];
            const secondNearest = driversWithDist[1];
            
            let message = `Top Nearby Drivers:\n\n`;
            driversWithDist.slice(0, 3).forEach((d, i) => {
                message += `${i+1}. ${d.profiles.full_name} (${d.distance.toFixed(1)} km)\n`;
            });
            message += `\nClick OK to assign the CLOSEST driver (${nearest.profiles.full_name}).\nCancel to abort.`;

            if(confirm(message)) {
                confirmAssignment(nearest.user_profileId || nearest.user_profile_id);
            }
        }

        window.confirmAssignment = async function(userProfileId) {
            if(!selectedRequestId) return;

            try {
                const { error } = await supabase
                    .from('bookings')
                    .update({ 
                        driver_profile_id: userProfileId,
                        trip_status: 'accepted'
                    })
                    .eq('booking_id', selectedRequestId);

                if (error) throw error;

                alert("Driver Assigned Successfully!");
                await loadInitialData(); // Refresh everything

            } catch(err) {
                alert("Assignment failed: " + err.message);
            }
        };

        // --- REALTIME UPDATES ---
        function subscribeToRealtime() {
            realtimeChannel = supabase
                .channel('dispatch-updates')
                .on('postgres_changes', 
                    { event: '*', schema: 'public', table: 'bookings' }, 
                    (payload) => {
                        if(payload.eventType === 'INSERT' || payload.new.trip_status !== 'requested') {
                            loadInitialData();
                        }
                    }
                )
                .on('postgres_changes',
                    { event: 'UPDATE', schema: 'public', table: 'drivers' },
                    (payload) => {
                        const userId = payload.old.user_profile_id;
                        if(driverMarkers[userId]) {
                            if(payload.new.current_latitude && payload.new.current_longitude) {
                                driverMarkers[userId].setLatLng([payload.new.current_latitude, payload.new.current_longitude]);
                            }
                        }
                    }
                )
                .subscribe();
        }

        // --- UTILS ---
        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            var R = 6371; 
            var dLat = deg2rad(lat2-lat1);
            var dLon = deg2rad(lon2-lon1); 
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon/2) * Math.sin(dLon/2); 
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
            return R * c;
        }

        function deg2rad(deg) { return deg * (Math.PI/180); }

        function alertsError(msg) {
            alert(msg);
        }

        window.addEventListener('beforeunload', () => {
            if (realtimeChannel) supabase.removeChannel(realtimeChannel);
        });

        // --- EVENT LISTENERS ---
        function setupEventListeners() {
            const menuToggleBtn = document.getElementById('menuToggleBtn');
            const globalSidebar = document.getElementById('globalSidebar');
            const sidebarOverlay = document.getElementById('sidebarOverlay');

            function toggleSidebar() {
                globalSidebar.classList.toggle('open');
                sidebarOverlay.classList.toggle('active');
            }

            if (menuToggleBtn) menuToggleBtn.addEventListener('click', toggleSidebar);
            if (sidebarOverlay) sidebarOverlay.addEventListener('click', () => {
                globalSidebar.classList.remove('open');
                sidebarOverlay.classList.remove('active');
            });

            document.getElementById('logoutBtn').addEventListener('click', async (e) => {
                e.preventDefault();
                if(confirm("Logout?")) {
                    await supabase.auth.signOut();
                    window.location.href = '/pahatid-system-project/login.html';
                }
            });
        }
        
    </script>
</body>
</html>
