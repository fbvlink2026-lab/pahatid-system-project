<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Dispatch | Diagnostic</title>
    
    <!-- CSS Libraries -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        body { background: #f0f0f0; }
        .dispatch-layout { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 70px); }
        @media (max-width: 768px) { .dispatch-layout { grid-template-columns: 1fr; } }
        
        /* DEBUG BOX */
        #debugBox {
            position: fixed; bottom: 0; left: 0; right: 0; height: 150px;
            background: black; color: lime; font-family: monospace; padding: 10px;
            overflow-y: auto; z-index: 9999; border-top: 2px solid red;
        }
    </style>
</head>
<body>

    <!-- SIMPLE HEADER FOR TEST -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Pahatid Dispatch (Diag)</span>
            <button class="btn btn-outline-light" id="testBtn">Test Button</button>
        </div>
    </nav>

    <div class="dispatch-layout">
        <div class="bg-white p-3 border-end">
            <h5>Incoming Orders</h5>
            <div id="orderList">Loading...</div>
        </div>
        <div id="map" style="height: 100%; width: 100%;"></div>
    </div>

    <!-- DEBUG OUTPUT -->
    <div id="debugBox"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- 
      CRITICAL CHANGE: 
      We are NOT using 'type="module"' anymore for this diagnostic test.
      This eliminates import/export issues entirely.
      If this works, the problem is definitely in your config.js or module loading.
    -->
    <script>
        const log = (msg) => {
            console.log(msg);
            const box = document.getElementById('debugBox');
            const line = document.createElement('div');
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            box.appendChild(line);
            box.scrollTop = box.scrollHeight;
        };

        document.addEventListener('DOMContentLoaded', () => {
            log(">>> DOM LOADED. STARTING DIAGNOSTIC...");

            // 1. TEST UI INTERACTIVITY (Hamburger/Button)
            const btn = document.getElementById('testBtn');
            if(btn) {
                btn.addEventListener('click', () => {
                    alert("BUTTON CLICKED! JS IS WORKING.");
                    log("✅ Button Click Event Fired Successfully.");
                });
                log("✅ Event Listener Attached to Button.");
            } else {
                log("❌ Button not found.");
            }

            // 2. TEST MAP INITIALIZATION
            try {
                if(typeof L === 'undefined') {
                    throw new Error("Leaflet Library (L) not loaded!");
                }
                const map = L.map('map').setView([14.5995, 120.9842], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; OSM'
                }).addTo(map);
                log("✅ Map Initialized Successfully.");
            } catch(e) {
                log(`❌ MAP ERROR: ${e.message}`);
            }

            // 3. TEST SUPABASE CONNECTION (Mocked for now since we removed imports)
            // If you have window.supabase defined globally from another script, uncomment below:
            /*
            if(window.supabase) {
                log("✅ Global Supabase Client Detected.");
            } else {
                log("⚠️ No Global Supabase Client. Data fetch skipped in Diag Mode.");
            }
            */

            log(">>> DIAGNOSTIC COMPLETE. Check if button works and map shows.");
        });
    </script>
</body>
</html>
