<!DOCTYPE html>
<html>
<head><title>Test</title></head>
<body>
<h1>Dispatch Test</h1>
<pre id="out">Loading...</pre>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const out = document.getElementById('out');
    
    // 1. Check if Library Loaded
    if (!window.supabase) {
        out.textContent = "ERROR: Supabase Library NOT loaded.";
        throw new Error("Library missing");
    }
    out.textContent += "\n✅ Library Loaded";

    // 2. Init Client
    const supabase = window.supabase.createClient(
        'https://tbmbidkujqwoexwkmovv.supabase.co', 
        'sb_publishable_pt5Gq6JdzWrxnV0J0MyaJQ_dAX4Qk25'
    );
    out.textContent += "\n✅ Client Created";

    // 3. Fetch Data IMMEDIATELY
    supabase.from('bookings').select('*').limit(1).then(res => {
        if (res.error) {
            out.textContent += `\n❌ DB ERROR: ${JSON.stringify(res.error)}`;
        } else {
            out.textContent += `\n✅ DATA RECEIVED:\n${JSON.stringify(res.data, null, 2)}`;
        }
    }).catch(err => {
        out.textContent += `\n💥 EXCEPTION: ${err.message}`;
    });
</script>
</body>
</html>
