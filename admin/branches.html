<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Branches | Pahatid Admin</title>
    
    <!-- CSS Libraries -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="../assets/css/style.css">
    
    <style>
        .branch-card {
            transition: transform 0.2s;
        }
        .branch-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }
        #map-picker-container {
            height: 300px;
            border-radius: 0.5rem;
            overflow: hidden;
            margin-top: 1rem;
            border: 2px dashed #dee2e6;
            cursor: crosshair;
        }
        .coord-display {
            font-family: monospace;
            background: #f8f9fa;
            padding: 0.5rem;
            border-radius: 0.25rem;
            margin-top: 0.5rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Mobile Menu Toggle Button -->
    <button class="mobile-menu-toggle" id="menuToggleBtn" aria-label="Toggle Navigation">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-wrapper">
        
        <!-- GLOBAL SIDEBAR NAVIGATION (Admin Context) -->
                <!-- GLOBAL SIDEBAR NAVIGATION (Admin Context - Dynamic) -->
                <!-- GLOBAL SIDEBAR NAVIGATION (Admin Context - Dynamic) -->
        <aside class="sidebar" id="globalSidebar">
            <div class="sidebar-header p-3 border-bottom border-dark">
                <a href="/pahatid-system-project/" class="text-decoration-none text-white fw-bold fs-5 d-block">
                    <i class="fas fa-shield-alt text-warning me-2"></i> Pahatid<span class="fw-normal ms-1">Admin</span>
                </a>
            </div>
            <ul class="nav flex-column p-2" id="dynamicNavList">
                <!-- Items loaded by sidebar-loader.js -->
            </ul>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="main-content">
            
            <header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <div>
                    <h4 class="mb-0 fw-bold">Branch Management</h4>
                    <small class="text-muted">Configure physical hubs and dispatch centers.</small>
                </div>
                <button class="btn btn-primary shadow-sm" data-bs-toggle="modal" data-bs-target="#addBranchModal">
                    <i class="fas fa-plus me-2"></i> Add New Branch
                </button>
            </header>

            <!-- Branch List Grid -->
            <div class="row g-4" id="branchesGrid">
                <!-- Populated by JS -->
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted">Loading branches...</p>
                </div>
            </div>

        </main>
    </div>

    <!-- ADD/EDIT BRANCH MODAL -->
    <div class="modal fade" id="addBranchModal" tabindex="-1" aria-labelledby="addBranchLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="addBranchLabel">Add / Edit Branch</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="branchForm">
                        <input type="hidden" id="editBranchId">
                        
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Branch Code *</label>
                                <input type="text" class="form-control" id="branchCode" required placeholder="e.g., MANILA-01">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Branch Name *</label>
                                <input type="text" class="form-control" id="branchName" required placeholder="e.g., Main Terminal">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Address *</label>
                                <textarea class="form-control" id="branchAddress" rows="2" required placeholder="Full street address..."></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Contact Number</label>
                                <input type="tel" class="form-control" id="branchContact" placeholder="+63...">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label d-block">Location Coordinates *</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="latInput" readonly placeholder="Click map...">
                                    <input type="text" class="form-control" id="lngInput" readonly placeholder="Click map...">
                                </div>
                                <div id="map-picker-container"></div>
                                <small class="text-muted d-block mt-1">Tap on the map to set location.</small>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveBranch()">Save Branch</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script type="module">
        import { supabase } from '../assets/js/config.js';

        // --- STATE MANAGEMENT ---
        let pickerMap = null;
        let pickerMarker = null;
        let currentEditingId = null;

        // DOM Elements
        const branchesGrid = document.getElementById('branchesGrid');
        const branchForm = document.getElementById('branchForm');
        const latInput = document.getElementById('latInput');
        const lngInput = document.getElementById('lngInput');
        const modalEl = document.getElementById('addBranchModal');
        const bsModal = new bootstrap.Modal(modalEl);

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            loadBranches();
            initPickerMap();
            setupEventListeners();
        });

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = '/pahatid-system-project/login.html';
                return;
            }
            const { data: profile } = await supabase.from('profiles').select('role').eq('id', session.user.id).single();
            if (profile.role !== 'admin') {
                alert("Access Denied.");
                window.location.href = '/pahatid-system-project/index.html';
            }
        }

        // --- MAP PICKER SETUP ---
        function initPickerMap() {
            pickerMap = L.map('map-picker-container').setView([14.5995, 120.9842], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(pickerMap);

            pickerMap.on('click', (e) => {
                const lat = e.latlng.lat;
                const lng = e.latlng.lng;
                
                latInput.value = lat.toFixed(6);
                lngInput.value = lng.toFixed(6);

                if (pickerMarker) pickerMap.removeLayer(pickerMarker);
                pickerMarker = L.marker([lat, lng]).addTo(pickerMap);
            });
        }

        // --- DATA LOADING ---
        async function loadBranches() {
            try {
                const { data, error } = await supabase
                    .from('branches')
                    .select('*')
                    .order('branch_name', { ascending: true });

                if (error) throw error;

                renderBranches(data || []);

            } catch (err) {
                console.error(err);
                branchesGrid.innerHTML = `<div class="col-12"><div class="alert alert-danger">Error loading branches: ${err.message}</div></div>`;
            }
        }

        function renderBranches(branches) {
            if (!branches.length) {
                branchesGrid.innerHTML = '<div class="col-12 text-center py-5 text-muted">No branches configured yet.</div>';
                return;
            }

            branchesGrid.innerHTML = branches.map(b => `
                <div class="col-md-4">
                    <div class="card branch-card h-100 shadow-sm border-0">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <h5 class="fw-bold text-primary mb-0">${b.branch_name}</h5>
                                <span class="badge bg-light text-dark border">${b.branch_code}</span>
                            </div>
                            
                            <p class="text-muted small mb-2">
                                <i class="fas fa-map-marker-alt me-2 text-danger"></i>${b.address}
                            </p>
                            <p class="text-muted small mb-3">
                                <i class="fas fa-phone me-2 text-success"></i>${b.contact_number || 'N/A'}
                            </p>

                            <div class="d-flex gap-2 mt-auto pt-3 border-top">
                                <button class="btn btn-sm btn-outline-primary flex-grow-1" onclick="openEditModal(${b.branch_id}, '${b.branch_code}', '${b.branch_name}', '${b.address.replace(/'/g, "\\'")}', '${b.contact_number || ''}', ${b.latitude}, ${b.longitude})">
                                    <i class="fas fa-edit me-1"></i> Edit
                                </button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteBranch(${b.branch_id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // --- ACTIONS ---

        window.openEditModal = (id, code, name, addr, contact, lat, lng) => {
            currentEditingId = id;
            document.getElementById('editBranchId').value = id;
            document.getElementById('branchCode').value = code;
            document.getElementById('branchName').value = name;
            document.getElementById('branchAddress').value = addr;
            document.getElementById('branchContact').value = contact;
            latInput.value = lat;
            lngInput.value = lng;

            // Set marker on map
            if (pickerMarker) pickerMap.removeLayer(pickerMarker);
            pickerMarker = L.marker([lat, lng]).addTo(pickerMap);
            pickerMap.setView([lat, lng], 15);

            document.getElementById('addBranchLabel').textContent = 'Edit Branch';
            bsModal.show();
        };

        // Reset modal when closed
        modalEl.addEventListener('hidden.bs.modal', () => {
            branchForm.reset();
            currentEditingId = null;
            document.getElementById('editBranchId').value = '';
            latInput.value = '';
            lngInput.value = '';
            if (pickerMarker) pickerMap.removeLayer(pickerMarker);
            pickerMap.setView([14.5995, 120.9842], 13);
            document.getElementById('addBranchLabel').textContent = 'Add / Edit Branch';
        });

        window.saveBranch = async () => {
            const code = document.getElementById('branchCode').value.trim();
            const name = document.getElementById('branchName').value.trim();
            const addr = document.getElementById('branchAddress').value.trim();
            const contact = document.getElementById('branchContact').value.trim();
            const lat = parseFloat(latInput.value);
            const lng = parseFloat(lngInput.value);

            if (!code || !name || !addr || isNaN(lat) || isNaN(lng)) {
                alert("Please fill all required fields and select a location on the map.");
                return;
            }

            const payload = {
                branch_code: code,
                branch_name: name,
                address: addr,
                contact_number: contact,
                latitude: lat,
                longitude: lng,
                is_active: true
            };

            try {
                if (currentEditingId) {
                    // Update
                    const { error } = await supabase
                        .from('branches')
                        .update(payload)
                        .eq('branch_id', currentEditingId);
                    
                    if (error) throw error;
                    alert("✅ Branch Updated!");
                } else {
                    // Insert
                    const { error } = await supabase
                        .from('branches')
                        .insert([payload]);
                    
                    if (error) throw error;
                    alert("✅ Branch Created!");
                }

                bsModal.hide();
                loadBranches();

            } catch (e) {
                console.error(e);
                alert("Failed to save: " + e.message);
            }
        };

        window.deleteBranch = async (id) => {
            if(!confirm("Are you sure you want to delete this branch? This cannot be undone.")) return;

            try {
                // Soft delete preferred, but hard delete for simplicity in MVP
                const { error } = await supabase
                    .from('branches')
                    .delete()
                    .eq('branch_id', id);
                
                if(error) throw error;
                
                alert("Branch Deleted.");
                loadBranches();
            } catch(e) {
                alert("Error deleting: " + e.message);
            }
        };

        // --- EVENT LISTENERS ---
        function setupEventListeners() {
            // Mobile Menu
            const menuToggleBtn = document.getElementById('menuToggleBtn');
            const globalSidebar = document.getElementById('globalSidebar');
            const sidebarOverlay = document.getElementById('sidebarOverlay');

            function toggleSidebar() {
                globalSidebar.classList.toggle('open');
                sidebarOverlay.classList.toggle('active');
            }

            if (menuToggleBtn) menuToggleBtn.addEventListener('click', toggleSidebar);
            if (sidebarOverlay) sidebarOverlay.addEventListener('click', () => {
                globalSidebar.classList.remove('open');
                sidebarOverlay.classList.remove('active');
            });

            // Logout
            document.getElementById('logoutBtn').addEventListener('click', async (e) => {
                e.preventDefault();
                if(confirm("Logout?")) {
                    await supabase.auth.signOut();
                    window.location.href = '/pahatid-system-project/login.html';
                }
            });
        }
    </script>


    <!-- AUTO-INJECTED NAV LOADER BY pahatid_autofix.py -->
    <script type="module">
    import { loadDynamicSidebar } from '../assets/js/sidebar-loader.js';
    
    document.addEventListener('DOMContentLoaded', async () => {
        const currentPath = window.location.pathname;
        let role = 'driver'; 
        
        if (currentPath.includes('/admin/')) role = 'admin';
        else if (currentPath.includes('/commuter/')) role = 'commuter';
        
        await loadDynamicSidebar('dynamicNavList', role);
    });
    </script>

</body>
</html>
