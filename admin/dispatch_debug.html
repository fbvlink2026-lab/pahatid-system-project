<!DOCTYPE html>

    <title>Dispatch Debug Mode</title>
    <!-- Load Libraries Directly from CDN to bypass local import issues -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: monospace; background: #1a1a1a; color: #0f0; padding: 20px; }
        .box { border: 1px solid #0f0; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        .error { color: #ff4444; border-color: #ff4444; }
        .success { color: #44ff44; border-color: #44ff44; }
        pre { white-space: pre-wrap; word-wrap: break-word; background: #000; padding: 10px; color: #ccc; }
        button { background: #0f0; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }

    <!-- AUTO-INJECTED MANDATORY LAYOUT CORE BY pahatid_autofix.py -->
    <style>
        /* =========================================
           PAHATID SYSTEM - MANDATORY LAYOUT CORE
           Version: 3.7.0 (Final Stable Release)
           Description: Unified Sidebar, Hamburger & Document Flow Logic
           ========================================= */

        /* --- 1. GLOBAL RESETS & BODY FLOW --- */
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #f4f6f9;
            overflow-x: hidden; 
            height: auto; 
        }

        /* --- 2. THE APP WRAPPER (Flex Container) --- */
        .app-wrapper {
            display: flex;
            width: 100%;
            min-height: 100vh; 
            position: relative;
            align-items: flex-start; 
        }

        /* --- 3. SIDEBAR BEHAVIOR --- */
        .sidebar {
            width: 260px;
            background: #212529;
            color: white;
            position: sticky; 
            top: 0;
            height: 100vh; 
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease-in-out;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            overflow-y: auto; 
            flex-shrink: 0;
        }

        /* --- 4. MAIN CONTENT AREA --- */
        .main-content {
            flex-grow: 1;
            width: calc(100% - 260px); 
            position: relative;
            background: #f4f6f9;
            min-height: 100vh;
        }

        /* --- 5. HAMBURGER BUTTON (PERSISTENT OVERLAY) --- */
        .mobile-menu-toggle {
            display: none; 
            position: fixed !important; 
            top: 15px;
            left: 15px;
            z-index: 9999; 
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--pahatid-primary, #0d6efd);
            color: white;
            border: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: transform 0.2s;
        }
        .mobile-menu-toggle:active { transform: scale(0.9); }

        /* --- 6. SIDEBAR OVERLAY (MOBILE BACKDROP) --- */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 998; 
            opacity: 0;
            transition: opacity 0.3s;
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.active {
            display: block;
            opacity: 1;
        }

        /* --- 7. MOBILE RESPONSIVENESS (< 992px) --- */
        @media (max-width: 991.98px) {
            
            .app-wrapper {
                display: block; 
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100dvh; 
                width: min(280px, 85vw); 
                transform: translateX(-100%); 
                box-shadow: none;
                z-index: 1000;
                overflow-y: auto;
            }
            
            .sidebar.open {
                transform: translateX(0);
                box-shadow: 5px 0 15px rgba(0,0,0,0.2);
            }

            .main-content {
                width: 100%;
                margin-left: 0;
            }

            .mobile-menu-toggle {
                display: flex !important; 
            }

            .page-title-row, 
            header.main-header:first-child {
                padding-left: 60px !important; 
            }
        }

</head>
<body>

    <h1>🚨 DISPATCH DEBUG CONSOLE</h1>
    <button onclick="runTest()">RUN FULL TEST</button>
    <div id="output"></div>

    <script>
        // CONFIGURATION - REPLACE WITH YOUR ACTUAL KEYS IF DIFFERENT
        const SUPABASE_URL = 'https://tbmbidkujqwoexwkmovv.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_pt5Gq6JdzWrxnV0J0MyaJQ_dAX4Qk25'; 

        let supabaseClient = null;

        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = `box ${type}`;
            div.innerHTML = `<strong>[${new Date().toLocaleTimeString()}]</strong> ${msg}`;
            document.getElementById('output').appendChild(div);
        }

        async function runTest() {
            document.getElementById('output').innerHTML = '';
            log("Starting Test...", "info");

            try {
                // 1. Check Library
                if (!window.supabase) throw new Error("Supabase Library not loaded!");
                log("✅ Supabase Library Loaded", "success");

                // 2. Init Client
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                log("✅ Client Initialized", "success");

                // 3. Auth Check
                const { data: { session }, error: authErr } = await supabaseClient.auth.getSession();
                if (authErr || !session) {
                    log(`⚠️ No Session Found. Error: ${authErr?.message}`, "error");
                    return;
                }
                log(`✅ Logged In as: ${session.user.id}`, "success");

                // 4. Fetch RAW Bookings (NO JOINS, NO FILTERS initially)
                log("Fetching ALL bookings (Limit 5)...", "info");
                const { data: allBookings, error: bErr } = await supabaseClient
                    .from('bookings')
                    .select('*')
                    .limit(5);

                if (bErr) {
                    log(`❌ DB ERROR: ${bErr.message} (Code: ${bErr.code})`, "error");
                    return;
                }

                log(`✅ Retrieved ${allBookings.length} records.`, "success");
                
                // Display Raw Data
                const pre = document.createElement('pre');
                pre.textContent = JSON.stringify(allBookings, null, 2);
                document.getElementById('output').appendChild(pre);

                // 5. Filter for 'requested' status manually in JS
                const pending = allBookings.filter(b => b.trip_status === 'requested');
                log(`Found ${pending.length} PENDING orders in sample.`, "info");

                if (pending.length > 0) {
                    log("SUCCESS: Database connection is working perfectly.", "success");
                    log("NEXT STEP: Fix the JOIN syntax in your main app using Manual Join strategy.", "info");
                } else {
                    log("WARNING: No 'requested' items found in the first 5 records. Try increasing limit or checking status values.", "error");
                }

            } catch (err) {
                log(`💥 FATAL EXCEPTION: ${err.message}`, "error");
                console.error(err);
            }
        }
    </script>

    <!-- AUTO-INJECTED NAV LOADER BY pahatid_autofix.py -->
    <script type="module">
    import { loadDynamicSidebar } from '../assets/js/sidebar-loader.js';
    
    document.addEventListener('DOMContentLoaded', async () => {
        const currentPath = window.location.pathname;
        let role = 'driver'; 
        
        if (currentPath.includes('/admin/')) role = 'admin';
        else if (currentPath.includes('/commuter/')) role = 'commuter';
        
        await loadDynamicSidebar('dynamicNavList', role);
    });
    </script>
