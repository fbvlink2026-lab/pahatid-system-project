<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Commuters | Pahatid Admin</title>
    
    <!-- CSS Libraries -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="../assets/css/style.css">
    
    <style>
        .table-container {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }
        .search-bar {
            max-width: 400px;
        }
        .status-badge {
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <!-- Mobile Menu Toggle Button -->
    <button class="mobile-menu-toggle" id="menuToggleBtn" aria-label="Toggle Navigation">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-wrapper">
        
        <!-- GLOBAL SIDEBAR NAVIGATION (Admin Context) -->
                <!-- GLOBAL SIDEBAR NAVIGATION (Admin Context - Dynamic) -->
        <aside class="sidebar" id="globalSidebar">
            <div class="sidebar-header p-3 border-bottom border-dark">
                <a href="/pahatid-system-project/" class="text-decoration-none text-white fw-bold fs-5 d-block">
                    <i class="fas fa-shield-alt text-warning me-2"></i> Pahatid<span class="fw-normal ms-1">Admin</span>
                </a>
            </div>
            <ul class="nav flex-column p-2" id="dynamicNavList">
                <!-- Items loaded by sidebar-loader.js -->
            </ul>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="main-content">
            
            <header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <div>
                    <h4 class="mb-0 fw-bold">Commuter Management</h4>
                    <small class="text-muted">View, search, and manage passenger accounts.</small>
                </div>
                <button class="btn btn-primary shadow-sm" onclick="loadCommutes()">
                    <i class="fas fa-sync-alt me-2"></i> Refresh List
                </button>
            </header>

            <!-- Search & Filters -->
            <div class="card card-custom shadow-sm mb-4 p-3">
                <div class="row g-3 align-items-center">
                    <div class="col-md-6">
                        <div class="input-group search-bar w-100">
                            <span class="input-group-text bg-light"><i class="fas fa-search"></i></span>
                            <input type="text" class="form-control" id="searchInput" placeholder="Search by Name, Phone, or Email...">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="statusFilter">
                            <option value="all">All Statuses</option>
                            <option value="active">Active Only</option>
                            <option value="suspended">Suspended Only</option>
                        </select>
                    </div>
                    <div class="col-md-3 text-end">
                        <span class="badge bg-secondary fs-6" id="totalCountBadge">0 Users</span>
                    </div>
                </div>
            </div>

            <!-- Data Table -->
            <div class="table-container shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="bg-light">
                            <tr>
                                <th scope="col">Commuter Name</th>
                                <th scope="col">Contact Info</th>
                                <th scope="col">Wallet Balance</th>
                                <th scope="col">Total Trips</th>
                                <th scope="col">Status</th>
                                <th scope="col" class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="commutersTableBody">
                            <tr>
                                <td colspan="6" class="text-center py-4 text-muted">Loading commuters...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script type="module">
        import { supabase, formatCurrency } from '../assets/js/config.js';

        // --- STATE MANAGEMENT ---
        let allCommutes = []; // Cache for local filtering
        let currentAdminId = null;

        // DOM Elements
        const tableBody = document.getElementById('commutersTableBody');
        const searchInput = document.getElementById('searchInput');
        const statusFilter = document.getElementById('statusFilter');
        const totalCountBadge = document.getElementById('totalCountBadge');

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', async () =>
            await loadDynamicSidebar('dynamicNavList', 'admin'); {
            await checkAuth();
            loadCommutes();
            setupEventListeners();
        });

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = '/pahatid-system-project/login.html';
                return;
            }
            
            const { data: profile } = await supabase.from('profiles').select('role').eq('id', session.user.id).single();
            if (profile.role !== 'admin') {
                alert("Access Denied.");
                window.location.href = '/pahatid-system-project/index.html';
            }
            currentAdminId = session.user.id;
        }

        // --- DATA LOADING ---
        async function loadCommutes() {
            try {
                // Fetch Commuters joined with Profiles and Booking Counts
                // Note: Getting exact trip count requires a subquery or separate fetch. 
                // For MVP performance, we'll just show wallet and basic info, 
                // and optionally fetch counts if dataset is small.
                
                const { data, error } = await supabase
                    .from('commuters')
                    .select(`
                        *,
                        profiles:user_profile_id(full_name, phone_number, email, status, created_at)
                    `)
                    .order('created_at', { ascending: false })
                    .limit(100); // Limit to recent 100 for performance

                if (error) throw error;

                allCommutes = data || [];
                renderTable(allCommutes);
                updateCounts(allCommutes.length);

            } catch (err) {
                console.error(err);
                tableBody.innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">Error loading data: ${err.message}</td></tr>`;
            }
        }

        function renderTable(commutes) {
            if (!commutes.length) {
                tableBody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">No commuters found.</td></tr>';
                return;
            }

            tableBody.innerHTML = commutes.map(c => {
                const p = c.profiles;
                const statusClass = p.status === 'active' ? 'bg-success' : (p.status === 'suspended' ? 'bg-danger' : 'bg-warning text-dark');
                const statusText = p.status.charAt(0).toUpperCase() + p.status.slice(1);
                
                // Mock Trip Count (In production, use a view or RPC for accurate aggregation)
                // Here we leave it as '--' or calculate if we fetched bookings separately
                const tripCount = '--'; 

                return `
                <tr>
                    <td>
                        <div class="fw-bold">${p.full_name}</div>
                        <small class="text-muted">Joined: ${new Date(p.created_at).toLocaleDateString()}</small>
                    </td>
                    <td>
                        <div><i class="fas fa-phone me-2 text-muted"></i>${p.phone_number || 'N/A'}</div>
                        <div><i class="fas fa-envelope me-2 text-muted"></i>${p.email}</div>
                    </td>
                    <td>
                        <strong class="text-primary">${formatCurrency(c.wallet_balance)}</strong>
                    </td>
                    <td>
                        <span class="badge bg-light text-dark">${tripCount}</span>
                    </td>
                    <td>
                        <span class="badge ${statusClass} status-badge">${statusText}</span>
                    </td>
                    <td class="text-end">
                        <div class="dropdown d-inline-block">
                            <button class="btn btn-outline-secondary btn-sm dropdown-toggle" data-bs-toggle="dropdown">
                                <i class="fas fa-cog"></i>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" href="#" onclick="viewDetails('${c.user_profile_id}')">View Profile</a></li>
                                <li><hr class="dropdown-divider"></li>
                                ${p.status === 'active' ? 
                                    `<li><a class="dropdown-item text-danger" href="#" onclick="toggleStatus('${c.user_profile_id}', 'suspended')">Suspend Account</a></li>` :
                                    `<li><a class="dropdown-item text-success" href="#" onclick="toggleStatus('${c.user_profile_id}', 'active')">Reactivate Account</a></li>`
                                }
                            </ul>
                        </div>
                    </td>
                </tr>
                `;
            }).join('');
        }

        function updateCounts(count) {
            totalCountBadge.textContent = `${count} Users`;
        }

        // --- FILTERING LOGIC ---
        function applyFilters() {
            const query = searchInput.value.toLowerCase();
            const statusVal = statusFilter.value;

            let filtered = allCommutes.filter(c => {
                const p = c.profiles;
                const matchesSearch = !query || 
                    p.full_name.toLowerCase().includes(query) || 
                    (p.phone_number && p.phone_number.includes(query)) ||
                    p.email.toLowerCase().includes(query);
                
                const matchesStatus = statusVal === 'all' || p.status === statusVal;

                return matchesSearch && matchesStatus;
            });

            renderTable(filtered);
            updateCounts(filtered.length);
        }

        // --- ACTIONS ---
        window.toggleStatus = async (userId, newStatus) => {
            const action = newStatus === 'suspended' ? 'SUSPEND' : 'REACTIVATE';
            if(!confirm(`Are you sure you want to ${action} this commuter?`)) return;

            try {
                const { error } = await supabase
                    .from('profiles')
                    .update({ status: newStatus })
                    .eq('id', userId);
                
                if(error) throw error;

                alert(`✅ User ${newStatus}.`);
                loadCommutes(); // Reload to reflect changes
            } catch(e) {
                alert("Error: " + e.message);
            }
        };

        window.viewDetails = (userId) => {
            // Placeholder for detailed modal/page
            alert(`Opening details for User ID: ${userId}\n(Full profile view coming in v3.1)`);
        };

        // --- EVENT LISTENERS ---
        function setupEventListeners() {
            // Search Input
            searchInput.addEventListener('input', applyFilters);
            statusFilter.addEventListener('change', applyFilters);

            // Mobile Menu
            const menuToggleBtn = document.getElementById('menuToggleBtn');
            const globalSidebar = document.getElementById('globalSidebar');
            const sidebarOverlay = document.getElementById('sidebarOverlay');

            function toggleSidebar() {
                globalSidebar.classList.toggle('open');
                sidebarOverlay.classList.toggle('active');
            }

            if (menuToggleBtn) menuToggleBtn.addEventListener('click', toggleSidebar);
            if (sidebarOverlay) sidebarOverlay.addEventListener('click', () => {
                globalSidebar.classList.remove('open');
                sidebarOverlay.classList.remove('active');
            });

            // Logout
            document.getElementById('logoutBtn').addEventListener('click', async (e) => {
                e.preventDefault();
                if(confirm("Logout?")) {
                    await supabase.auth.signOut();
                    window.location.href = '/pahatid-system-project/login.html';
                }
            });
        }
    </script>

</body>
</html>
