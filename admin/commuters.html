    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script type="module">
        import { supabase, formatCurrency } from '../assets/js/config.js';
        import { loadDynamicSidebar } from '../assets/js/sidebar-loader.js';

        // --- STATE MANAGEMENT ---
        let allCommutes = []; 
        let currentAdminId = null;

        // DOM Elements
        const tableBody = document.getElementById('commutersTableBody');
        const cardsContainer = document.getElementById('commutersCardsContainer');
        const searchInput = document.getElementById('searchInput');
        const statusFilter = document.getElementById('statusFilter');
        const totalCountBadge = document.getElementById('totalCountBadge');

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await loadDynamicSidebar('dynamicNavList', 'admin');
                await checkAuth();
                await loadCommutes();
                setupEventListeners();
            } catch (err) {
                console.error("Init Error:", err);
                alert("Failed to initialize page: " + err.message);
            }
        });

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = '/pahatid-system-project/login.html';
                return;
            }
            
            const { data: profile } = await supabase.from('profiles').select('role').eq('id', session.user.id).single();
            if (profile.role !== 'admin') {
                alert("Access Denied.");
                window.location.href = '/pahatid-system-project/index.html';
            }
            currentAdminId = session.user.id;
        }

        // --- DATA LOADING (UPDATED FOR YOUR SPECIFIC SCHEMA) ---
        async function loadCommutes() {
            try {
                // Joining commuters table with profiles table
                // We select specific columns that exist in your DB dump
                const { data, error } = await supabase
                    .from('commuters')
                    .select(`
                        commuter_id,
                        user_profile_id,
                        wallet_balance,
                        preferred_payment_method,
                        referral_code,
                        referred_by_uuid,
                        default_payment_method,
                        profiles:user_profile_id(full_name, phone_number, email, status, created_at)
                    `)
                    .order('created_at', { ascending: false })
                    .limit(100);

                if (error) throw error;

                allCommutes = data || [];
                renderTable(allCommutes);
                updateCounts(allCommutes.length);

            } catch (err) {
                console.error(err);
                const errMsg = `<tr><td colspan="6" class="text-center text-danger py-4">Error loading data: ${err.message}</td></tr>`;
                if(tableBody) tableBody.innerHTML = errMsg;
                if(cardsContainer) cardsContainer.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
            }
        }

        function renderTable(commutes) {
            if (!commutes.length) {
                if(tableBody) tableBody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">No commuters found.</td></tr>';
                if(cardsContainer) cardsContainer.innerHTML = '<div class="text-center py-3 text-muted">No commuters found.</div>';
                return;
            }

            // Desktop Render
            if(tableBody) {
                tableBody.innerHTML = commutes.map(c => {
                    const p = c.profiles;
                    const statusClass = p.status === 'active' ? 'bg-success' : (p.status === 'suspended' ? 'bg-danger' : 'bg-warning text-dark');
                    const statusText = p.status.charAt(0).toUpperCase() + p.status.slice(1);
                    
                    return `
                    <tr>
                        <td>
                            <small class="text-muted">#${c.commuter_id}</small><br>
                            <span class="ref-code-text small">${c.referral_code || '-'}</span>
                        </td>
                        <td>
                            <div class="fw-bold">${p.full_name}</div>
                            <small class="text-muted">Joined: ${new Date(p.created_at).toLocaleDateString()}</small>
                        </td>
                        <td>
                            <div><i class="fas fa-phone me-2 text-muted"></i>${p.phone_number || 'N/A'}</div>
                            <div><i class="fas fa-envelope me-2 text-muted"></i>${p.email}</div>
                        </td>
                        <td>
                            <strong class="text-primary">${formatCurrency(c.wallet_balance)}</strong>
                        </td>
                        <td>
                            <span class="badge ${statusClass} status-badge">${statusText}</span>
                        </td>
                        <td class="text-end">
                            <div class="dropdown d-inline-block">
                                <button class="btn btn-outline-secondary btn-sm dropdown-toggle" data-bs-toggle="dropdown">
                                    <i class="fas fa-cog"></i>
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end">
                                    <li><a class="dropdown-item" href="#" onclick="viewDetails('${c.user_profile_id}')">View Profile</a></li>
                                    <li><hr class="dropdown-divider"></li>
                                    ${p.status === 'active' ? 
                                        `<li><a class="dropdown-item text-danger" href="#" onclick="toggleStatus('${c.user_profile_id}', 'suspended')">Suspend Account</a></li>` :
                                        `<li><a class="dropdown-item text-success" href="#" onclick="toggleStatus('${c.user_profile_id}', 'active')">Reactivate Account</a></li>`
                                    }
                                </ul>
                            </div>
                        </td>
                    </tr>
                    `;
                }).join('');
            }

            // Mobile Render
            if(cardsContainer) {
                cardsContainer.innerHTML = commutes.map(c => {
                    const p = c.profiles;
                    const statusClass = p.status === 'active' ? 'bg-success' : (p.status === 'suspended' ? 'bg-danger' : 'bg-warning text-dark');
                    const statusText = p.status.charAt(0).toUpperCase() + p.status.slice(1);
                    
                    return `
                    <div class="data-card">
                        <div class="data-card-header">
                            <span class="data-card-title">${p.full_name}</span>
                            <span class="badge ${statusClass}">${statusText}</span>
                        </div>
                        <div class="data-card-body">
                            <div><small class="text-muted">Ref:</small> <code class="small">${c.referral_code || 'None'}</code></div>
                            <div><small class="text-muted">Phone:</small> ${p.phone_number || 'N/A'}</div>
                            <div><small class="text-muted">Balance:</small> <strong class="text-primary">${formatCurrency(c.wallet_balance)}</strong></div>
                        </div>
                        <div class="data-card-actions">
                            <button class="btn btn-sm btn-outline-primary" onclick="viewDetails('${c.user_profile_id}')">Details</button>
                            ${p.status === 'active' ? 
                                `<button class="btn btn-sm btn-outline-danger" onclick="toggleStatus('${c.user_profile_id}', 'suspended')">Suspend</button>` :
                                `<button class="btn btn-sm btn-outline-success" onclick="toggleStatus('${c.user_profile_id}', 'active')">Activate</button>`
                            }
                        </div>
                    </div>
                    `;
                }).join('');
            }
        }

        function updateCounts(count) {
            totalCountBadge.textContent = `${count} Users`;
        }

        // --- FILTERING LOGIC ---
        function applyFilters() {
            const query = searchInput.value.toLowerCase();
            const statusVal = statusFilter.value;

            let filtered = allCommutes.filter(c => {
                const p = c.profiles;
                const matchesSearch = !query || 
                    p.full_name.toLowerCase().includes(query) || 
                    (p.phone_number && p.phone_number.includes(query)) ||
                    p.email.toLowerCase().includes(query) ||
                    (c.referral_code && c.referral_code.toLowerCase().includes(query));
                
                const matchesStatus = statusVal === 'all' || p.status === statusVal;

                return matchesSearch && matchesStatus;
            });

            renderTable(filtered);
            updateCounts(filtered.length);
        }

        // --- ACTIONS ---
        window.toggleStatus = async (userId, newStatus) => {
            const action = newStatus === 'suspended' ? 'SUSPEND' : 'REACTIVATE';
            if(!confirm(`Are you sure you want to ${action} this commuter?`)) return;

            try {
                const { error } = await supabase
                    .from('profiles')
                    .update({ status: newStatus })
                    .eq('id', userId);
                
                if(error) throw error;

                alert(`✅ User ${newStatus}.`);
                loadCommutes(); 
            } catch(e) {
                alert("Error: " + e.message);
            }
        };

        window.viewDetails = (userId) => {
            alert(`Opening details for User ID: ${userId}\n(Full profile view coming soon)`);
        };

        // --- EVENT LISTENERS ---
        function setupEventListeners() {
            searchInput.addEventListener('input', applyFilters);
            statusFilter.addEventListener('change', applyFilters);

            const menuToggleBtn = document.getElementById('menuToggleBtn');
            const globalSidebar = document.getElementById('globalSidebar');
            const sidebarOverlay = document.getElementById('sidebarOverlay');

            function toggleSidebar() {
                globalSidebar.classList.toggle('open');
                sidebarOverlay.classList.toggle('active');
            }

            if (menuToggleBtn) menuToggleBtn.addEventListener('click', toggleSidebar);
            if (sidebarOverlay) sidebarOverlay.addEventListener('click', () => {
                globalSidebar.classList.remove('open');
                sidebarOverlay.classList.remove('active');
            });
        }
    </script>


    <!-- AUTO-INJECTED NAV LOADER BY pahatid_autofix.py -->
    <script type="module">
    import { loadDynamicSidebar } from '../assets/js/sidebar-loader.js';
    
    document.addEventListener('DOMContentLoaded', async () => {
        const currentPath = window.location.pathname;
        let role = 'driver'; 
        
        if (currentPath.includes('/admin/')) role = 'admin';
        else if (currentPath.includes('/commuter/')) role = 'commuter';
        
        await loadDynamicSidebar('dynamicNavList', role);
    });
    </script>
