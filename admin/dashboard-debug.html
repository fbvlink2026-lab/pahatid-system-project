<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEBUG CONSOLE | Pahatid Admin</title>
    
    <!-- CSS Libraries -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        .console-panel {
            background: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.85rem;
            padding: 20px;
            border-radius: 8px;
            height: 400px;
            overflow-y: auto;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        
        .log-entry { margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 4px; }
        .log-time { color: #6a9955; margin-right: 10px; }
        .log-info { color: #569cd6; }
        .log-success { color: #4ec9b0; font-weight: bold; }
        .log-error { color: #f44747; font-weight: bold; }
        .log-warn { color: #ce9178; }
        .log-data { color: #c586c0; background: #2d2d2d; padding: 5px; display: block; margin-top: 5px; max-height: 150px; overflow:auto;}

        .result-card {
            background: white;
            border-left: 5px solid #0dcaf0;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-radius: 4px;
        }
        .result-count { font-size: 2rem; font-weight: bold; color: #0dcaf0; }
        .table-preview { width: 100%; font-size: 0.8rem; margin-top: 10px; }
        .table-preview th { background: #f8f9fa; }
        .table-preview td { vertical-align: middle; }
        
        .btn-run { min-width: 200px; }
    </style>
</head>
<body>

<div class="container py-5">
    
    <header class="mb-4 text-center">
        <h2><i class="fas fa-bug text-danger me-2"></i> Database Diagnostic Console</h2>
        <p class="text-muted">Running tests to identify why Active Trips are not showing in Dashboard.</p>
        <div id="authStatus" class="badge bg-secondary p-2">Checking Authentication...</div>
    </header>

    <!-- CONTROL PANEL -->
    <div class="card shadow-sm mb-4">
        <div class="card-body d-flex gap-2 flex-wrap justify-content-center">
            <button class="btn btn-primary btn-run" onclick="runTest_A_DirectJoin()">
                <i class="fas fa-plug me-1"></i> Test A: Direct Supabase Join
            </button>
            <button class="btn btn-warning btn-run" onclick="runTest_B_ManualFetch()">
                <i class="fas fa-hand-paper me-1"></i> Test B: Manual Two-Step Fetch
            </button>
            <button class="btn btn-dark btn-run" onclick="runTest_C_RawDump()">
                <i class="fas fa-database me-1"></i> Test C: Raw Dump (No Filters)
            </button>
            <button class="btn btn-outline-danger btn-run" onclick="clearConsole()">
                <i class="fas fa-trash me-1"></i> Clear Log
            </button>
        </div>
    </div>

    <!-- LOG OUTPUT -->
    <div class="console-panel" id="consoleOutput">
        <div class="log-entry log-info"><span class="log-time">[--:--:--]</span> Waiting for commands...</div>
    </div>

    <!-- RESULTS AREA -->
    <div id="resultsArea"></div>

</div>

<script type="module">
    import { supabase } from '../assets/js/config.js'; // Adjust path if needed

    let isAdmin = false;
    const consoleEl = document.getElementById('consoleOutput');
    const resultsArea = document.getElementById('resultsArea');
    const authBadge = document.getElementById('authStatus');

    // --- INITIALIZATION ---
    document.addEventListener('DOMContentLoaded', async () => {
        await checkAdminAuth();
    });

    async function checkAdminAuth() {
        try {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                authBadge.textContent = "❌ Not Logged In";
                authBadge.className = "badge bg-danger p-2";
                log("User not authenticated.", "error");
                return;
            }

            const userId = session.user.id;
            const { data: profile, error } = await supabase.from('profiles').select('role').eq('id', userId).single();

            if (error || !profile) {
                authBadge.textContent = "❌ Profile Error";
                log(`Profile fetch failed: ${error?.message}`, "error");
                return;
            }

            if (profile.role === 'admin') {
                isAdmin = true;
                authBadge.textContent = "✅ Verified Admin";
                authBadge.className = "badge bg-success p-2";
                log("Authentication successful. Ready to test.", "success");
            } else {
                authBadge.textContent = `⚠️ Role: ${profile.role} (Not Admin)`;
                authBadge.className = "badge bg-warning text-dark p-2";
                log(`Access denied. Current role is '${profile.role}'.`, "warn");
            }
        } catch (err) {
            log(`Fatal Auth Error: ${err.message}`, "error");
        }
    }

    // --- LOGGER UTILITY ---
    window.log = function(message, type = 'info') {
        const time = new Date().toLocaleTimeString();
        const entry = document.createElement('div');
        entry.className = `log-entry log-${type}`;
        entry.innerHTML = `<span class="log-time">[${time}]</span> ${message}`;
        consoleEl.prepend(entry);
    };

    window.clearConsole = function() {
        consoleEl.innerHTML = '<div class="log-entry log-info"><span class="log-time">[CLEARED]</span> Console cleared.</div>';
        resultsArea.innerHTML = '';
    };

    // --- TEST CASES ---

    /**
     * TEST A: Replicates the exact logic used in the previous dashboard version
     * Uses relational joins (.select('*, profiles(...)')) which might fail due to ambiguity.
     */
    window.runTest_A_DirectJoin = async function() {
        if(!isAdmin) return log("Please login as Admin first.", "error");
        
        log("--- STARTING TEST A: DIRECT JOIN METHOD ---", "info");
        resultsArea.innerHTML = '';

        try {
            const startTime = performance.now();
            
            // Attempting complex join
            const { data, error } = await supabase
                .from('bookings')
                .select(`
                    *,
                    commuter_profiles:commuter_profile_id(full_name),
                    driver_profiles:driver_profile_id(full_name)
                `)
                .in('trip_status', ['accepted', 'arrived_pickup', 'in_progress', 'cancellation_requested'])
                .order('created_at', { ascending: false })
                .limit(5);

            const endTime = performance.now();
            const duration = (endTime - startTime).toFixed(2);

            if (error) {
                log(`❌ FAILED (${duration}ms): ${error.message}`, "error");
                renderResultCard("TEST A RESULT", "FAILED", error.message, null);
            } else {
                log(`✅ SUCCESS (${duration}ms): Retrieved ${data.length} records.`, "success");
                log(`Data Sample: ${JSON.stringify(data[0] || {})}`, "data");
                renderResultCard("TEST A RESULT", "SUCCESS", `${data.length} Records Found`, data);
            }

        } catch (exc) {
            log(`💥 EXCEPTION: ${exc.message}`, "error");
            renderResultCard("TEST A RESULT", "CRASH", exc.message, null);
        }
    };

    /**
     * TEST B: The robust manual strategy
     * Step 1: Get IDs only.
     * Step 2: Fetch names separately using .in().
     * This avoids FK ambiguity issues entirely.
     */
    window.runTest_B_ManualFetch = async function() {
        if(!isAdmin) return log("Please login as Admin first.", "error");

        log("--- STARTING TEST B: MANUAL TWO-STEP FETCH ---", "info");
        resultsArea.innerHTML = '';

        try {
            const startTime = performance.now();

            // STEP 1: Get Bookings (Simple Select *)
            const { data: bookings, error: bookErr } = await supabase
                .from('bookings')
                .select('*') 
                .in('trip_status', ['accepted', 'arrived_pickup', 'in_progress', 'cancellation_requested'])
                .limit(5);

            if (bookErr) throw bookErr;
            log(`Step 1 Complete: Got ${bookings.length} bookings.`, "info");

            if(bookings.length === 0) {
                log("No active bookings found in DB.", "warn");
                renderResultCard("TEST B RESULT", "EMPTY", "Database has no matching rows.", []);
                return;
            }

            // STEP 2: Extract Unique IDs
            const cIds = [...new Set(bookings.map(b => b.commuter_profile_id).filter(Boolean))];
            const dIds = [...new Set(bookings.map(b => b.driver_profile_id).filter(Boolean))];
            
            log(`Extracted IDs -> Commuters: [${cIds.join(',')}], Drivers: [${dIds.join(',')}]`, "info");

            // STEP 3: Parallel Fetch Names
            const promises = [];
            if(cIds.length > 0) promises.push(supabase.from('profiles').select('id, full_name').in('id', cIds));
            else promises.push(Promise.resolve({data:[]}));

            if(dIds.length > 0) promises.push(supabase.from('profiles').select('id, full_name').in('id', dIds));
            else promises.push(Promise.resolve({data:[]}));

            const [resC, resD] = await Promise.all(promises);
            
            const cMap = {}; resC.data.forEach(p => cMap[p.id] = p.full_name);
            const dMap = {}; resD.data.forEach(p => dMap[p.id] = p.full_name);

            // STEP 4: Merge
            const enriched = bookings.map(b => ({
                ...b,
                commuterName: cMap[b.commuter_profile_id] || 'Unknown',
                driverName: dMap[b.driver_profile_id] || 'Unassigned'
            }));

            const endTime = performance.now();
            const duration = (endTime - startTime).toFixed(2);

            log(`✅ SUCCESS (${duration}ms): Enriched ${enriched.length} records manually.`, "success");
            renderResultCard("TEST B RESULT", "SUCCESS", `${enriched.length} Records (Manual Join)`, enriched);

        } catch (exc) {
            log(`💥 EXCEPTION during Manual Fetch: ${exc.message}`, "error");
            renderResultCard("TEST B RESULT", "ERROR", exc.message, null);
        }
    };

    /**
     * TEST C: Nuclear Option
     * Fetches EVERYTHING without filters to see if RLS is blocking specific statuses.
     */
    window.runTest_C_RawDump = async function() {
        if(!isAdmin) return log("Please login as Admin first.", "error");

        log("--- STARTING TEST C: RAW DUMP (NO STATUS FILTER) ---", "info");
        resultsArea.innerHTML = '';

        try {
            const { data, error } = await supabase
                .from('bookings')
                .select('booking_id, trip_status, reference_code, created_at')
                .order('created_at', { ascending: false })
                .limit(20); // Just look at recent activity

            if (error) throw error;

            log(`Retrieved ${data.length} total recent bookings.`, "info");
            
            // Analyze Status Distribution
            const statusCounts = {};
            data.forEach(b => {
                statusCounts[b.trip_status] = (statusCounts[b.trip_status] || 0) + 1;
            });

            log(`Status Breakdown: ${JSON.stringify(statusCounts)}`, "data");

            // Check specifically for cancellation_requested
            const cancelReqs = data.filter(b => b.trip_status === 'cancellation_requested');
            if(cancelReqs.length > 0) {
                log(`🔍 FOUND ${cancelReqs.length} PENDING CANCELLATIONS IN RAW DATA!`, "success");
                log(`IDs: ${cancelReqs.map(r=>r.booking_id).join(', ')}`, "data");
            } else {
                log(`ℹ️ No 'cancellation_requested' status found in last 20 records.`, "warn");
            }

            renderResultCard("TEST C RESULT", "INFO", "Raw Status Analysis", data);

        } catch (exc) {
            log(`💥 EXCEPTION: ${exc.message}`, "error");
            renderResultCard("TEST C RESULT", "ERROR", exc.message, null);
        }
    };

    // --- RENDER HELPERS ---
    function renderResultCard(title, status, message, data) {
        const div = document.createElement('div');
        div.className = 'result-card';
        
        let badgeClass = status === 'SUCCESS' ? 'bg-success' : (status === 'FAILED' || status === 'ERROR' ? 'bg-danger' : 'bg-info');
        
        let tableHtml = '';
        if(data && Array.isArray(data) && data.length > 0) {
            // Simple preview of first 3 items
            const sample = data.slice(0, 3);
            tableHtml = `
                <table class="table table-bordered table-striped table-hover table-preview mt-2">
                    <thead><tr><th>ID</th><th>Status</th><th>Ref Code</th><th>Driver Name</th></tr></thead>
                    <tbody>
                        ${sample.map(row => `
                            <tr>
                                <td>${row.booking_id}</td>
                                <td><code>${row.trip_status}</code></td>
                                <td>${row.reference_code || '-'}</td>
                                <td>${row.driverName || row.drivers?.full_name || 'N/A'}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
                <small class="text-muted">Showing top 3 of ${data.length} records.</small>
            `;
        }

        div.innerHTML = `
            <div class="d-flex justify-content-between align-items-start mb-2">
                <h5 class="mb-0">${title}</h5>
                <span class="badge ${badgeClass}">${status}</span>
            </div>
            <p class="mb-0 fw-bold">${message}</p>
            ${tableHtml}
        `;
        resultsArea.appendChild(div);
    }
</script>

</body>
</html>
