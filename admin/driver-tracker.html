    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script type="module">
        import { supabase, formatCurrency } from '../assets/js/config.js';

        // --- CONFIGURATION ---
        const SPEED_LIMIT_KMH = 60;
        const HARSH_TURN_ANGLE = 45;
        const MIN_DISTANCE_FOR_CALC = 0.05;
        const FINANCIAL_REFRESH_INTERVAL_MS = 30000; 
        
        // Geocoding Throttle (Don't spam Nominatim API)
        let lastGeocodeTime = 0;
        const GEOCODE_THROTTLE_MS = 5000; // Wait 5 seconds between geocode attempts

        // --- STATE MANAGEMENT ---
        let mapInstance = null;
        let driverMarker = null;
        let trailPolyline = null;
        let currentTrailPoints = [];
        let realtimeChannel = null;
        let driverId = null; // This is user_profile_id (UUID)
        let financialTimer = null;
        
        // Safety Tracking State
        let lastPosition = null;
        let lastDirection = null;
        let sessionStartTime = null;
        let maxRecordedSpeed = 0;
        let harshEventCount = 0;
        let currentSpeedKmh = 0;

        // DOM Elements
        const infoPanel = document.getElementById('infoPanel');
        const showPanelFab = document.getElementById('showPanelFab');
        const globalAlertBanner = document.getElementById('globalAlertBanner');
        const alertMessageEl = document.getElementById('alertMessage');

        // Display Elements
        const dispDriverName = document.getElementById('dispDriverName');
        const dispVehicleType = document.getElementById('dispVehicleType');
        const dispPlateNumber = document.getElementById('dispPlateNumber');
        const dispEmpBadge = document.getElementById('dispEmpBadge');
        
        // Location Display Elements
        const locMainText = document.getElementById('locMainText');
        const locSubText = document.getElementById('locSubText');
        
        const valSpeed = document.getElementById('valSpeed');
        const valMaxSpeed = document.getElementById('valMaxSpeed');
        const valHarshTurns = document.getElementById('valHarshTurns');
        const valUptime = document.getElementById('valUptime');
        const barFuelLevel = document.getElementById('barFuelLevel');
        const txtFuelPercent = document.getElementById('txtFuelPercent');
        const txtFuelLiters = document.getElementById('txtFuelLiters');
        const badgeConnection = document.getElementById('badgeConnection');
        const txtLastPing = document.getElementById('txtLastPing');
        
        // Financial Elements
        const valGrossIncome = document.getElementById('valGrossIncome');
        const valTotalExpense = document.getElementById('valTotalExpense');
        const valNetIncome = document.getElementById('valNetIncome');

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            driverId = urlParams.get('id');

            if (!driverId) {
                alert("Missing Driver ID.");
                window.location.href = 'drivers.html';
                return;
            }

            await checkAuth();
            initMap();
            loadDriverDetails(); 
            subscribeToRealtime();
            setupEventListeners(); 
            
            setInterval(updateUptimeDisplay, 1000);
            
            fetchTodaysEarnings(); 
            financialTimer = setInterval(fetchTodaysEarnings, FINANCIAL_REFRESH_INTERVAL_MS);
        });

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = '/pahatid-system-project/login.html'; return; }
            const { data: profile } = await supabase.from('profiles').select('role').eq('id', session.user.id).single();
            if (profile.role !== 'admin') { alert("Access Denied."); window.location.href = '/pahatid-system-project/index.html'; }
        }

        function initMap() {
            mapInstance = L.map('map', {
                zoomControl: false 
            }).setView([14.5995, 120.9842], 13);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(mapInstance);

            L.control.zoom({
                position: 'bottomleft'
            }).addTo(mapInstance);

            trailPolyline = L.polyline([], { color: '#0d6efd', weight: 4, opacity: 0.7 }).addTo(mapInstance);
        }

        /**
         * CRITICAL FIX: TWO-STEP FETCH STRATEGY
         */
        async function loadDriverDetails() {
            try {
                const { data: driver, error: drvErr } = await supabase
                    .from('drivers')
                    .select('*')
                    .eq('user_profile_id', driverId)
                    .single();

                if (drvErr || !driver) throw new Error("Driver not found");

                let fullName = "Unknown Driver";
                if (driver.user_profile_id) {
                    const { data: profileData, error: profErr } = await supabase
                        .from('profiles')
                        .select('full_name')
                        .eq('id', driver.user_profile_id)
                        .single();
                    
                    if (!profErr && profileData) {
                        fullName = profileData.full_name || "Unnamed";
                    }
                }

                dispDriverName.textContent = fullName;
                dispPlateNumber.textContent = driver.vehicle_plate_number || "N/A";
                
                let vehName = "Standard Bike";
                if (driver.custom_efficiency_kml) vehName = "Custom Config";
                else if (driver.preferred_vehicle_id) vehName = "Registered Vehicle";
                dispVehicleType.textContent = vehName;

                const empType = driver.employment_type || 'freelance';
                dispEmpBadge.textContent = empType.toUpperCase();
                dispEmpBadge.className = `emp-badge-mini ${empType === 'hired' ? 'emp-hired' : 'emp-freelance'}`;

                updateStatusUI(driver.is_online, driver.last_location_update);
                renderFuelUI(driver.tank_capacity_liters, driver.current_fuel_liters);

                if (driver.current_latitude && driver.current_longitude) {
                    lastPosition = { lat: driver.current_latitude, lng: driver.current_longitude, timestamp: Date.now() };
                    sessionStartTime = Date.now();
                    
                    placeOrUpdateMarker(driver.current_latitude, driver.current_longitude, 'normal');
                    currentTrailPoints.push([driver.current_latitude, driver.current_longitude]);
                    trailPolyline.setLatLngs(currentTrailPoints);
                    mapInstance.setView([driver.current_latitude, driver.current_longitude], 16);
                    
                    // Trigger Initial Geocode
                    triggerReverseGeocode(driver.current_latitude, driver.current_longitude);
                }
            } catch (err) {
                console.error(err);
                dispDriverName.textContent = "Error Loading Driver";
            }
        }

        // --- SMART REVERSE GEOCODING LOGIC ---
        async function triggerReverseGeocode(lat, lng) {
            const now = Date.now();
            
            // Throttle: Only call API if enough time has passed since last call
            if (now - lastGeocodeTime < GEOCODE_THROTTLE_MS) {
                return; 
            }
            
            lastGeocodeTime = now;

            // Update Sub-text immediately with coords so user knows where we are looking
            locSubText.textContent = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
            locMainText.innerHTML = '<span class="loading-spinner-small"></span> Resolving address...';

            try {
                // Using Nominatim (OSM Free Service)
                // Adding a short timeout to prevent hanging the UI
                const controller = new AbortController();
                const signal = controller.signal;
                setTimeout(() => controller.abort(), 3000); // 3 second timeout

                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`, { signal });
                
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                
                if (data && data.display_name) {
                    // Format nicely: Take first 2 parts (usually Street/Town + City/Municipality)
                    const parts = data.display_name.split(',');
                    const niceName = parts.slice(0, 2).join(', ').trim();
                    
                    locMainText.textContent = niceName || "Address Found";
                    locSubText.textContent = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
                } else {
                    locMainText.textContent = "No Address Data";
                }

            } catch (err) {
                console.warn("Geocode failed or timed out:", err);
                // Fallback to showing just coordinates clearly
                locMainText.textContent = "Coordinates Only";
                locSubText.textContent = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
            }
        }

        // --- FETCH TODAY'S EARNINGS FROM TRIP_LOGS ---
        async function fetchTodaysEarnings() {
            if(!driverId) return;
            
            try {
                const startOfDay = new Date();
                startOfDay.setHours(0,0,0,0);
                const endOfDay = new Date();
                endOfDay.setHours(23,59,59,999);

                const { data, error } = await supabase
                    .from('trip_logs')
                    .select('gross_fare, total_expenses, net_income')
                    .eq('driver_profile_id', driverId) 
                    .gte('logged_at', startOfDay.toISOString())
                    .lte('logged_at', endOfDay.toISOString());

                if (error) throw error;

                if (data && data.length > 0) {
                    const totals = data.reduce((acc, curr) => {
                        acc.gross += parseFloat(curr.gross_fare || 0);
                        acc.expense += parseFloat(curr.total_expenses || 0);
                        acc.net += parseFloat(curr.net_income || 0);
                        return acc;
                    }, { gross: 0, expense: 0, net: 0 });

                    valGrossIncome.textContent = formatCurrency(totals.gross);
                    valTotalExpense.textContent = "-" + formatCurrency(totals.expense);
                    valNetIncome.textContent = formatCurrency(totals.net);
                    
                    valNetIncome.className = totals.net >= 0 ? 'fin-val val-net' : 'fin-val text-danger';
                } else {
                    valGrossIncome.textContent = "₱0.00";
                    valTotalExpense.textContent = "-₱0.00";
                    valNetIncome.textContent = "₱0.00";
                    valNetIncome.className = 'fin-val val-net';
                }
            } catch (err) {
                console.warn("Could not fetch earnings:", err);
            }
        }

        function updateStatusUI(isOnline, ts) {
            if (isOnline) {
                badgeConnection.className = 'badge bg-success';
                badgeConnection.textContent = 'ONLINE';
            } else {
                badgeConnection.className = 'badge bg-danger';
                badgeConnection.textContent = 'OFFLINE';
            }
            if(ts) txtLastPing.textContent = new Date(ts).toLocaleTimeString();
        }

        function renderFuelUI(capacity, current) {
            if (!capacity || capacity <= 0) {
                txtFuelLiters.textContent = "-- L";
                txtFuelPercent.textContent = "--%";
                barFuelLevel.style.width = "0%";
                return;
            }

            const percent = Math.max(0, Math.min(100, (current / capacity) * 100));
            barFuelLevel.style.width = `${percent}%`;
            txtFuelPercent.textContent = `${Math.round(percent)}%`;
            txtFuelLiters.textContent = `${current.toFixed(1)} L / ${capacity} L`;

            if (percent < 20) {
                barFuelLevel.style.background = 'linear-gradient(90deg, #dc3545, #ff6b6b)';
            } else if (percent < 50) {
                barFuelLevel.style.background = 'linear-gradient(90deg, #ffc107, #ffe082)';
            } else {
                barFuelLevel.style.background = 'linear-gradient(90deg, #198754, #0dcaf0)';
            }
        }

        // --- CORE SAFETY LOGIC ---
        function handleLocationUpdate(newData) {
            const lat = newData.current_latitude;
            const lng = newData.current_longitude;
            const isOnline = newData.is_online;
            const timestampStr = newData.last_location_update;
            const cap = parseFloat(newData.tank_capacity_liters);
            const cur = parseFloat(newData.current_fuel_liters);

            updateStatusUI(isOnline, timestampStr);
            renderFuelUI(cap, cur);

            if (!lat || !lng) return;

            // Always update sub-text with fresh coords immediately
            locSubText.textContent = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;

            const now = Date.now();
            const newPos = { lat, lng, timestamp: now };

            if (lastPosition) {
                const distKm = getDistanceFromLatLonInKm(lastPosition.lat, lastPosition.lng, lat, lng);
                const timeDeltaSec = (now - lastPosition.timestamp) / 1000;

                if (distKm > MIN_DISTANCE_FOR_CALC && timeDeltaSec > 1) {
                    const speedKmh = (distKm / timeDeltaSec) * 3600;
                    currentSpeedKmh = Math.round(speedKmh);
                    
                    if (currentSpeedKmh > maxRecordedSpeed) {
                        maxRecordedSpeed = currentSpeedKmh;
                        valMaxSpeed.textContent = maxRecordedSpeed;
                    }
                    valSpeed.textContent = currentSpeedKmh;

                    let riskLevel = 'normal';
                    if (currentSpeedKmh > SPEED_LIMIT_KMH) {
                        riskLevel = 'danger';
                        triggerAlert(`SPEED WARNING: ${currentSpeedKmh} KM/H`);
                    } else if (currentSpeedKmh > SPEED_LIMIT_KMH * 0.8) {
                        riskLevel = 'fast';
                    }

                    if (lastDirection !== null && distKm > 0.05) {
                        const newDir = calculateBearing(lastPosition.lat, lastPosition.lng, lat, lng);
                        const angleDiff = Math.abs(normalizeAngle(newDir - lastDirection));
                        
                        if (angleDiff > HARSH_TURN_ANGLE) {
                            harshEventCount++;
                            valHarshTurns.textContent = harshEventCount;
                            triggerAlert(`HARSH TURN DETECTED (${Math.round(angleDiff)}°)`);
                            riskLevel = 'danger';
                        }
                        lastDirection = newDir;
                    } else if (lastDirection === null) {
                        lastDirection = calculateBearing(lastPosition.lat, lastPosition.lng, lat, lng);
                    }

                    placeOrUpdateMarker(lat, lng, riskLevel);
                    updateTrailColor(riskLevel);
                    
                    // Attempt to update readable address if moved significantly or stopped
                    // We rely on the throttle inside triggerReverseGeocode to prevent spamming
                    triggerReverseGeocode(lat, lng);
                }
            } else {
                lastDirection = null; 
                triggerReverseGeocode(lat, lng);
            }

            currentTrailPoints.push([lat, lng]);
            if(currentTrailPoints.length > 100) currentTrailPoints.shift();
            trailPolyline.setLatLngs(currentTrailPoints);

            lastPosition = newPos;
        }

        function placeOrUpdateMarker(lat, lng, riskLevel) {
            if (!driverMarker) {
                const iconHtml = `<div style="background:${getRiskColor(riskLevel)};color:white;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;box-shadow:0 2px 5px rgba(0,0,0,0.3);border:2px solid white;"><i class="fas fa-motorcycle"></i></div>`;
                const driverIcon = L.divIcon({ className: 'custom-driver-icon', html: iconHtml, iconSize: [30, 30], iconAnchor: [15, 15] });
                driverMarker = L.marker([lat, lng], { icon: driverIcon }).addTo(mapInstance);
            } else {
                driverMarker.setLatLng([lat, lng]);
            }
        }

        function updateTrailColor(level) {
            const colors = { 'normal': '#0d6efd', 'fast': '#ffc107', 'danger': '#dc3545' };
            trailPolyline.setStyle({ color: colors[level] || colors['normal'] });
        }

        function getRiskColor(level) {
            const colors = { 'normal': '#0d6efd', 'fast': '#ffc107', 'danger': '#dc3545' };
            return colors[level];
        }

        function triggerAlert(msg) {
            alertMessageEl.textContent = msg;
            globalAlertBanner.classList.add('show');
            setTimeout(() => { globalAlertBanner.classList.remove('show'); }, 3000);
        }

        // --- UTILITIES ---
        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            var R = 6371;
            var dLat = deg2rad(lat2-lat1);
            var dLon = deg2rad(lon2-lon1); 
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * 
                    Math.sin(dLon/2) * Math.sin(dLon/2); 
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
            return R * c;
        }

        function deg2rad(deg) { return deg * (Math.PI/180); }

        function calculateBearing(lat1, lng1, lat2, lng2) {
            var phi1 = deg2rad(lat1);
            var phi2 = deg2rad(lat2);
            var deltaLambda = deg2rad(lng2 - lng1);
            var y = Math.sin(deltaLambda) * Math.cos(phi2);
            var x = Math.cos(phi1)*Math.sin(phi2) - Math.sin(phi1)*Math.cos(phi2)*Math.cos(deltaLambda);
            var theta = Math.atan2(y, x);
            return (theta * 180 / Math.PI + 360) % 360;
        }

        function normalizeAngle(angle) {
            while (angle <= -180) angle += 360;
            while (angle > 180) angle -= 360;
            return angle;
        }

        function updateUptimeDisplay() {
            if (!sessionStartTime) return;
            const diffMs = Date.now() - sessionStartTime;
            const mins = Math.floor(diffMs / 60000);
            valUptime.textContent = `${mins}m`;
        }

        // --- REALTIME SUBSCRIPTION ---
        function subscribeToRealtime() {
            if (realtimeChannel) supabase.removeChannel(realtimeChannel);
            realtimeChannel = supabase
                .channel('driver-safety-monitor')
                .on('postgres_changes', 
                    { event: 'UPDATE', schema: 'public', table: 'drivers', filter: `user_profile_id=eq.${driverId}` }, 
                    (payload) => { handleLocationUpdate(payload.new); }
                )
                .subscribe();
        }

        // --- CONTROLS ---
        window.togglePanel = function() {
            const isHidden = infoPanel.classList.contains('hidden');
            
            if (isHidden) {
                infoPanel.classList.remove('hidden');
                showPanelFab.classList.remove('visible');
            } else {
                infoPanel.classList.add('hidden');
                showPanelFab.classList.add('visible');
            }
        };

        window.centerOnDriver = function() {
            if (driverMarker) {
                mapInstance.setView(driverMarker.getLatLng(), 17);
            }
        };

        window.resetMetrics = function() {
            if(!confirm("Reset safety stats?")) return;
            maxRecordedSpeed = 0;
            harshEventCount = 0;
            currentSpeedKmh = 0;
            sessionStartTime = Date.now();
            lastPosition = null;
            lastDirection = null;
            currentTrailPoints = [];
            trailPolyline.setLatLngs([]);
            
            valMaxSpeed.textContent = "0";
            valHarshTurns.textContent = "0";
            valSpeed.textContent = "0";
            valUptime.textContent = "0m";
            locMainText.textContent = "Waiting for GPS...";
            locSubText.textContent = "-- , --";
            
            if(driverMarker) mapInstance.removeLayer(driverMarker);
            driverMarker = null;
        };

        // --- UNIFIED EVENT LISTENERS (FIXED HAMBURGER) ---
        function setupEventListeners() {
            const menuToggleBtn = document.getElementById('menuToggleBtn');
            const globalSidebar = document.getElementById('globalSidebar');
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            
            if (menuToggleBtn) {
                menuToggleBtn.addEventListener('click', () => {
                    globalSidebar.classList.toggle('open');
                    sidebarOverlay.classList.toggle('active');
                });
            }

            if (sidebarOverlay) {
                sidebarOverlay.addEventListener('click', () => {
                    globalSidebar.classList.remove('open');
                    sidebarOverlay.classList.remove('active');
                });
            }

            document.getElementById('logoutBtn').addEventListener('click', async (e) => {
                e.preventDefault();
                if(confirm("Logout?")) {
                    await supabase.auth.signOut();
                    window.location.href = '/pahatid-system-project/login.html';
                }
            });
        }

        window.addEventListener('beforeunload', () => {
            if (realtimeChannel) supabase.removeChannel(realtimeChannel);
            if (financialTimer) clearInterval(financialTimer);
        });

    </script>
