    <script type="module">
        import { supabase, formatCurrency } from '../assets/js/config.js';

        let currentUserId = null;
        let allTripsCache = []; 
        let activeFilter = 'all'; // Default filter
        
        const cardsContainer = document.getElementById('cardsContainer');
        const globalLoader = document.getElementById('globalLoader');
        const searchInput = document.getElementById('searchInput');
        const tabButtons = document.querySelectorAll('.nav-pill-btn');
        
        // Count Elements
        const countAllEl = document.getElementById('count-all');
        const countCancelEl = document.getElementById('count-cancel');
        const countProgressEl = document.getElementById('count-progress');
        const countWaitingEl = document.getElementById('count-waiting');

        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            loadTrips();
            setupEventListeners();
        });

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = '/pahatid-system-project/login.html'; return; }
            currentUserId = session.user.id;
            const { data: profile } = await supabase.from('profiles').select('role').eq('id', currentUserId).single();
            if (profile.role !== 'admin') { alert("Access Denied."); window.location.href = '/pahatid-system-project/index.html'; }
        }

        /**
         * OPTIMIZED LOADING LOGIC (VERIFIED FOREIGN KEY JOINS)
         * Uses exact constraint names confirmed via SQL Diagnostic:
         * 1. bookings_commuter_profile_id_fkey
         * 2. bookings_driver_profile_id_fkey
         */
        async function loadTrips() {
            try {
                showLoading(true);
                
                // 1. Fetch Bookings WITH Joined Profile Data in ONE GO
                // CRITICAL FIX: Using the EXACT FK names retrieved from database schema
                const { data: rawBookings, error } = await supabase
                    .from('bookings')
                    .select(`
                        *,
                        commuter_profiles:profiles!bookings_commuter_profile_id_fkey(full_name),
                        driver_profiles:profiles!bookings_driver_profile_id_fkey(full_name, id)
                    `)
                    .in('trip_status', ['accepted', 'arrived_pickup', 'in_progress', 'cancellation_requested'])
                    .order('created_at', { ascending: false })
                    .limit(50);

                if (error) throw error;

                if (!rawBookings || rawBookings.length === 0) {
                    renderEmptyState("No active trips found.");
                    updateCounts(0,0,0,0);
                    showLoading(false);
                    return;
                }

                // 2. Transform Data Structure for Rendering
                // We map the joined objects into flat properties expected by our card renderer
                allTripsCache = rawBookings.map(b => ({
                    ...b,
                    // Extract Commuter Name safely with fallback to ID prefix if missing
                    commuterName: b.commuter_profiles?.full_name || ('ID: ' + (b.commuter_profile_id ? b.commuter_profile_id.substring(0,8) : 'N/A')),
                    
                    // Extract Driver Name AND UUID for Tracking Link
                    driverName: b.driver_profiles?.full_name || 'Unassigned',
                    driverUuid: b.driver_profiles?.id || null // This is the critical piece for the Track button
                }));

                // 3. Update Counts & Render Current View
                updateCountsFromCache(allTripsCache);
                applyFilterAndRender();
                
                showLoading(false);

            } catch (err) {
                console.error(err);
                renderEmptyState(`Error: ${err.message}`, true);
                showLoading(false);
            }
        }

        function updateCountsFromCache(trips) {
            const cancels = trips.filter(t => t.trip_status === 'cancellation_requested').length;
            const progresses = trips.filter(t => t.trip_status === 'in_progress').length;
            const waiting = trips.filter(t => ['accepted', 'arrived_pickup'].includes(t.trip_status)).length;
            const total = trips.length;

            countAllEl.textContent = total;
            countCancelEl.textContent = cancels;
            countProgressEl.textContent = progresses;
            countWaitingEl.textContent = waiting;
        }

        function applyFilterAndRender() {
            const term = searchInput.value.toLowerCase().trim();
            
            let filteredTrips = allTripsCache;

            // Apply Tab Filter
            if (activeFilter === 'cancellation_requested') {
                filteredTrips = filteredTrips.filter(t => t.trip_status === 'cancellation_requested');
            } else if (activeFilter === 'in_progress') {
                filteredTrips = filteredTrips.filter(t => t.trip_status === 'in_progress');
            } else if (activeFilter === 'accepted_arrived') {
                filteredTrips = filteredTrips.filter(t => ['accepted', 'arrived_pickup'].includes(t.trip_status));
            }
            // 'all' keeps everything

            // Apply Search Filter
            if (term) {
                filteredTrips = filteredTrips.filter(t => 
                    t.reference_code.toLowerCase().includes(term) || 
                    t.driverName.toLowerCase().includes(term) ||
                    t.communterName.toLowerCase().includes(term)
                );
            }

            if (filteredTrips.length === 0) {
                renderEmptyState("No trips match your criteria.");
            } else {
                renderCards(filteredTrips);
            }
        }

        function renderCards(trips) {
            cardsContainer.innerHTML = ''; // Clear existing
            
            trips.forEach(t => {
                const cardHtml = createTripCard(t);
                cardsContainer.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        function createTripCard(t) {
            // Determine Visual Classes
            let borderClass = 'card-border-waiting';
            let chipClass = 'chip-waiting';
            let statusText = 'WAITING PICKUP';
            let actionsHtml = '';

            // Common Track Button HTML Generator
            // Uses the UUID extracted from the direct join above
            const getTrackButton = (uuid) => uuid ? `
                <a href="driver-tracker.html?id=${uuid}" target="_blank" class="btn-mobile-action btn-track-live">
                    <i class="fas fa-location-crosshairs"></i> TRACK LIVE
                </a>` : '';

            if (t.trip_status === 'cancellation_requested') {
                borderClass = 'card-border-cancel';
                chipClass = 'chip-cancel';
                statusText = 'CANCEL REQ.';
                actionsHtml = `
                    <div class="action-buttons-group">
                        <button class="btn-mobile-action btn-approve-big" onclick="handleApproval('${t.booking_id}', true)">
                            <i class="fas fa-check"></i> Approve
                        </button>
                        <button class="btn-mobile-action btn-reject-big" onclick="handleApproval('${t.booking_id}', false)">
                            <i class="fas fa-ban"></i> Reject
                        </button>
                        ${getTrackButton(t.driverUuid)}
                    </div>`;
            } else if (t.trip_status === 'in_progress') {
                borderClass = 'card-border-progress';
                chipClass = 'chip-progress';
                statusText = 'IN PROGRESS';
                actionsHtml = `
                    <div class="action-buttons-group">
                        <button class="btn-mobile-action btn-force-big" onclick="forceCancel('${t.booking_id}')">
                            <i class="fas fa-times-circle"></i> Force Stop
                        </button>
                        ${getTrackButton(t.driverUuid)}
                    </div>`;
            } else {
                // Accepted or Arrived Pickup
                statusText = t.trip_status === 'arrived_pickup' ? 'ARRIVED' : 'ACCEPTED';
                actionsHtml = `
                    <div class="action-buttons-group">
                        <button class="btn-mobile-action btn-force-big" onclick="forceCancel('${t.booking_id}')">
                            <i class="fas fa-times-circle"></i> Force Cancel
                        </button>
                        ${getTrackButton(t.driverUuid)}
                    </div>`;
            }

            const reasonBox = (t.trip_status === 'cancellation_requested') ? 
                `<div class="reason-alert-box">
                    <i class="fas fa-exclamation-circle"></i>
                    <div>
                        <strong>Reason:</strong> ${t.cancellation_reason_text || 'Not specified'}<br>
                        <small class="opacity-75">Requested by Driver</small>
                    </div>
                </div>` : '';

            const timeStr = new Date(t.started_at || t.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

            return `
            <div class="mobile-trip-card ${borderClass}">
                <div class="card-body-mobile">
                    <div class="card-top-row">
                        <span class="ref-code-text">#${t.reference_code}</span>
                        <span class="status-chip ${chipClass}">${statusText}</span>
                    </div>

                    <div class="parties-info-grid">
                        <div class="party-item">
                            <span class="party-label">Driver</span>
                            <span class="party-name">${t.driverName}</span>
                        </div>
                        <div class="party-item">
                            <span class="party-label">Passenger</span>
                            <span class="party-name">${t.communterName}</span>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3 small text-muted">
                        <span><i class="far fa-clock me-1"></i> ${timeStr}</span>
                        <span><i class="fas fa-route me-1"></i> ${t.pickup_address ? t.pickup_address.substring(0,15)+'...' : 'N/A'}</span>
                    </div>

                    ${reasonBox}
                    
                    ${actionsHtml}
                </div>
            </div>
            `;
        }

        function renderEmptyState(msg, isError = false) {
            cardsContainer.innerHTML = `
                <div class="empty-state-mobile">
                    <i class="fas ${isError ? 'fa-exclamation-triangle text-danger' : 'fa-inbox'}"></i>
                    <h5>${msg}</h5>
                    <p class="small">Pull down to refresh or adjust filters.</p>
                </div>
            `;
        }

        function showLoading(show) {
            if(show) globalLoader.classList.add('active');
            else globalLoader.classList.remove('active');
        }

        // ACTIONS
        window.handleApproval = async function(id, approved) {
            const actionText = approved ? "APPROVE" : "REJECT";
            if(!confirm(`Are you sure you want to ${actionText} this cancellation request?`)) return;
            
            try {
                showLoading(true);
                const updates = approved ? 
                    { trip_status: 'cancelled', driver_profile_id: null, cancelled_at: new Date().toISOString(), cancelled_by_role: 'admin_approved' } :
                    { trip_status: 'arrived_pickup', notes: 'ADMIN_REJECTED_CANCEL_REQ' };
                
                const { error } = await supabase.from('bookings').update(updates).eq('booking_id', id);
                if(error) throw error;
                
                // Simple toast/alert simulation since no library loaded
                alert(`✅ Request ${actionText}d.`);
                await loadTrips();
            } catch(e) { 
                alert("❌ Error: " + e.message);
                showLoading(false);
            }
        };

        window.forceCancel = async function(id) {
             if(!confirm("Force Cancel this ride immediately?")) return;
             try {
                showLoading(true);
                const { error } = await supabase.from('bookings').update({ 
                    trip_status: 'cancelled', 
                    driver_profile_id: null,
                    cancelled_at: new Date().toISOString(),
                    cancelled_by_role: 'admin_force'
                }).eq('booking_id', id);
                if(error) throw error;
                alert("✅ Ride Cancelled.");
                await loadTrips();
            } catch(e) { 
                alert("❌ Error: " + e.message);
                showLoading(false);
            }
        };

        // EVENT LISTENERS
        function setupEventListeners() {
            // Sidebar Toggle
            const menuToggleBtn = document.getElementById('menuToggleBtn');
            const globalSidebar = document.getElementById('globalSidebar');
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            function toggleSidebar() { globalSidebar.classList.toggle('open'); sidebarOverlay.classList.toggle('active'); }
            if(menuToggleBtn) menuToggleBtn.addEventListener('click', toggleSidebar);
            if(sidebarOverlay) sidebarOverlay.addEventListener('click', () => { globalSidebar.classList.remove('open'); sidebarOverlay.classList.remove('active'); });
            
            // Logout
            document.getElementById('logoutBtn').addEventListener('click', async (e) => { 
                e.preventDefault(); 
                if(confirm("Logout?")) { await supabase.auth.signOut(); window.location.href = '/pahatid-system-project/login.html'; } 
            });

            // Tab Switching Logic
            tabButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Remove active from all
                    tabButtons.forEach(b => b.classList.remove('active'));
                    // Add to clicked
                    btn.classList.add('active');
                    // Set filter
                    activeFilter = btn.dataset.filter;
                    // Re-render
                    applyFilterAndRender();
                });
            });

            // Search Input Debounce
            let searchTimeout;
            searchInput.addEventListener('input', () => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    applyFilterAndRender();
                }, 300);
            });
        }
    </script>
