<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip History | Pahatid Commuter</title>
    
    <!-- CSS Libraries -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="../assets/css/style.css">
    
    <style>
        .history-card {
            border-left: 4px solid var(--pahatid-secondary);
            transition: all 0.2s;
        }
        .history-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .history-card.completed { border-left-color: var(--pahatid-success); }
        .history-card.cancelled { border-left-color: var(--pahatid-danger); opacity: 0.8; }
        
        .route-summary {
            font-size: 0.9rem;
            color: #495057;
            margin: 0.5rem 0;
            line-height: 1.4;
        }
        .route-point {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .point-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: white;
        }
        .point-pickup { background: var(--pahatid-success); }
        .point-dropoff { background: var(--pahatid-danger); }
        
        .action-links a {
            text-decoration: none;
            font-size: 0.85rem;
            margin-right: 10px;
            cursor: pointer;
        }
        .action-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Mobile Menu Toggle Button -->
    <button class="mobile-menu-toggle" id="menuToggleBtn" aria-label="Toggle Navigation">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-wrapper">
        
        <!-- GLOBAL SIDEBAR NAVIGATION (Commuter Context) -->
        <aside class="sidebar" id="globalSidebar">
            <div class="sidebar-header">
                <a href="/pahatid-system-project/" class="sidebar-brand">
                    <i class="fas fa-motorcycle text-warning"></i> Pahatid<span class="text-white fw-normal ms-1">Commuter</span>
                </a>
            </div>
            
            <ul class="sidebar-nav">
                <li><a href="dashboard.html" class="sidebar-link"><i class="fas fa-home me-2"></i> My Home</a></li>
                <li><a href="book-ride.html" class="sidebar-link"><i class="fas fa-plus-circle me-2"></i> Book Ride</a></li>
                <li><a href="favorites.html" class="sidebar-link"><i class="fas fa-heart me-2"></i> Favorites</a></li>
                <li><a href="track-order.html" class="sidebar-link"><i class="fas fa-route me-2"></i> Track Order</a></li>
                <li><a href="#" class="sidebar-link active"><i class="fas fa-history me-2"></i> Trip History</a></li>
                
                <li class="sidebar-section-title">Support</li>
                <li><a href="support-tickets.html" class="sidebar-link"><i class="fas fa-life-ring me-2"></i> Help Center</a></li>
                <li><a href="#" id="logoutBtn" class="sidebar-link text-danger mt-3"><i class="fas fa-sign-out-alt me-2"></i> Logout</a></li>
            </ul>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="main-content p-3 p-md-4">
            
            <header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <div>
                    <h4 class="mb-0 fw-bold"><i class="fas fa-history text-primary me-2"></i> Trip History</h4>
                    <small class="text-muted">View past rides and receipts.</small>
                </div>
            </header>

            <!-- Filter Tabs -->
            <ul class="nav nav-pills mb-4" id="historyTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="all-tab" data-bs-toggle="pill" data-bs-target="#pane-all" type="button" role="tab">All Trips</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="completed-tab" data-bs-toggle="pill" data-bs-target="#pane-completed" type="button" role="tab">Completed</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="cancelled-tab" data-bs-toggle="pill" data-bs-target="#pane-cancelled" type="button" role="tab">Cancelled</button>
                </li>
            </ul>

            <div class="tab-content" id="historyTabContent">
                
                <!-- PANE: ALL -->
                <div class="tab-pane fade show active" id="pane-all" role="tabpanel">
                    <div id="list-all" class="d-flex flex-column gap-3">
                        <div class="text-center py-5 text-muted">
                            <i class="fas fa-spinner fa-spin fa-2x mb-2"></i>
                            <p>Loading history...</p>
                        </div>
                    </div>
                </div>

                <!-- PANE: COMPLETED -->
                <div class="tab-pane fade" id="pane-completed" role="tabpanel">
                    <div id="list-completed" class="d-flex flex-column gap-3">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- PANE: CANCELLED -->
                <div class="tab-pane fade" id="pane-cancelled" role="tabpanel">
                    <div id="list-cancelled" class="d-flex flex-column gap-3">
                        <!-- Populated by JS -->
                    </div>
                </div>

            </div>

        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script type="module">
        import { supabase, formatCurrency } from '../assets/js/config.js';

        // --- STATE MANAGEMENT ---
        let currentUser = null;

        // DOM Elements
        const listAll = document.getElementById('list-all');
        const listCompleted = document.getElementById('list-completed');
        const listCancelled = document.getElementById('list-cancelled');

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            loadHistory();
            setupEventListeners();
        });

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = '/pahatid-system-project/login.html';
                return;
            }
            currentUser = session.user;
        }

        // --- DATA LOADING (FIXED LOGIC) ---
        async function loadHistory() {
            try {
                console.log("📡 Step 1: Fetching Bookings...");
                
                // 1. Get Raw Bookings ONLY (No Joins yet to avoid FK errors)
                const { data: bookings, error: bErr } = await supabase
                    .from('bookings')
                    .select('*')
                    .eq('commuter_profile_id', currentUser.id)
                    .order('created_at', { ascending: false })
                    .limit(50);

                if (bErr) throw bErr;

                if (!bookings || bookings.length === 0) {
                    renderEmptyState();
                    return;
                }

                console.log("✅ Got", bookings.length, "bookings.");

                // 2. Extract Unique Driver IDs
                const driverIds = [...new Set(bookings.map(b => b.driver_profile_id).filter(id => id))];
                
                let driversMap = {};

                // 3. If there are drivers assigned, fetch their profiles separately
                if (driverIds.length > 0) {
                    console.log("📡 Step 2: Fetching Driver Profiles for IDs:", driverIds);
                    
                    const { data: driversData, error: dErr } = await supabase
                        .from('profiles')
                        .select('id, full_name')
                        .in('id', driverIds); // Using 'id' which is the primary key of profiles

                    if (dErr) throw dErr;

                    // Create a map for quick lookup: { userId: fullName }
                    driversMap = driversData.reduce((acc, drv) => {
                        acc[drv.id] = drv.full_name;
                        return acc;
                    }, {});
                }

                // 4. Merge Data Manually in Memory
                const enrichedTrips = bookings.map(trip => ({
                    ...trip,
                    driverName: trip.driver_profile_id ? (driversMap[trip.driver_profile_id] || 'Unknown Driver') : 'Pending Assignment'
                }));

                renderLists(enrichedTrips);

            } catch (err) {
                console.error("Load Error:", err);
                listAll.innerHTML = `<div class="alert alert-danger">Failed to load history: ${err.message}</div>`;
            }
        }

        function renderEmptyState() {
            const emptyMsg = '<div class="text-center py-5 text-muted"><i class="fas fa-inbox fa-2x mb-2"></i><p>No trips found yet.</p></div>';
            listAll.innerHTML = emptyMsg;
            listCompleted.innerHTML = emptyMsg;
            listCancelled.innerHTML = emptyMsg;
        }

        function renderLists(trips) {
            if (!trips.length) {
                renderEmptyState();
                return;
            }

            const completed = trips.filter(t => t.trip_status === 'completed');
            const cancelled = trips.filter(t => t.trip_status === 'cancelled' || t.trip_status === 'no_show');
            
            // Render All
            listAll.innerHTML = trips.map(createHistoryCard).join('');
            
            // Render Completed
            listCompleted.innerHTML = completed.length ? completed.map(createHistoryCard).join('') : 
                '<div class="text-center py-4 text-muted">No completed trips yet.</div>';
                
            // Render Cancelled
            listCancelled.innerHTML = cancelled.length ? cancelled.map(createHistoryCard).join('') : 
                '<div class="text-center py-4 text-muted">No cancelled trips.</div>';
        }

        function createHistoryCard(trip) {
            const statusClass = trip.trip_status === 'completed' ? 'completed' : 'cancelled';
            const statusBadge = trip.trip_status === 'completed' 
                ? '<span class="badge bg-success">Completed</span>' 
                : '<span class="badge bg-danger">Cancelled</span>';
            
            const dateStr = new Date(trip.created_at).toLocaleDateString('en-PH', { 
                year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' 
            });

            // Truncate addresses safely
            const pickupShort = trip.pickup_address ? trip.pickup_address.substring(0, 30) + '...' : 'N/A';
            const dropoffShort = trip.dropoff_address ? trip.dropoff_address.substring(0, 30) + '...' : 'N/A';

            return `
                <div class="card card-custom shadow-sm history-card ${statusClass}">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div>
                                <h6 class="fw-bold mb-0">${dateStr}</h6>
                                <small class="text-muted">Ref: ${trip.reference_code}</small>
                            </div>
                            ${statusBadge}
                        </div>
                        
                        <div class="route-summary">
                            <div class="route-point mb-1">
                                <div class="point-icon point-pickup"><i class="fas fa-circle"></i></div>
                                <span>${pickupShort}</span>
                            </div>
                            <div class="route-point">
                                <div class="point-icon point-dropoff"><i class="fas fa-square"></i></div>
                                <span>${dropoffShort}</span>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
                            <div>
                                <small class="text-muted d-block">Driver</small>
                                <strong class="small">${trip.driverName}</strong>
                            </div>
                            <div class="text-end">
                                <small class="text-muted d-block">Fare</small>
                                <strong class="text-primary fs-5">${formatCurrency(trip.final_fare)}</strong>
                            </div>
                        </div>

                        <div class="action-links mt-3">
                            ${trip.trip_status === 'completed' ? `
                                <a onclick="rebookRoute('${trip.booking_id}')"><i class="fas fa-redo me-1"></i> Rebook This Route</a>
                                <a href="support-tickets.html?booking_id=${trip.booking_id}" class="text-danger"><i class="fas fa-exclamation-triangle me-1"></i> Report Issue</a>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        // --- ACTIONS ---
        window.rebookRoute = async function(bookingId) {
            try {
                // Fetch fresh data for coordinates
                const { data, error } = await supabase
                    .from('bookings')
                    .select('pickup_lat, pickup_lng, dropoff_lat, dropoff_lng, pickup_address, dropoff_address')
                    .eq('booking_id', bookingId)
                    .single();

                if (error || !data) {
                    alert("Could not retrieve route details.");
                    return;
                }

                sessionStorage.setItem('pahatid_prefill_route', JSON.stringify({
                    pickup_lat: data.pickup_lat,
                    pickup_lng: data.pickup_lng,
                    pickup_addr: data.pickup_address,
                    dropoff_lat: data.dropoff_lat,
                    dropoff_lng: data.dropoff_lng,
                    dropoff_addr: data.dropoff_address
                }));

                window.location.href = 'book-ride.html?source=history_rebook';

            } catch (e) {
                console.error(e);
                alert("Error initiating rebook.");
            }
        };

        // --- EVENT LISTENERS ---
        function setupEventListeners() {
            const menuToggleBtn = document.getElementById('menuToggleBtn');
            const globalSidebar = document.getElementById('globalSidebar');
            const sidebarOverlay = document.getElementById('sidebarOverlay');

            function toggleSidebar() {
                globalSidebar.classList.toggle('open');
                sidebarOverlay.classList.toggle('active');
            }

            if (menuToggleBtn) menuToggleBtn.addEventListener('click', toggleSidebar);
            if (sidebarOverlay) sidebarOverlay.addEventListener('click', () => {
                globalSidebar.classList.remove('open');
                sidebarOverlay.classList.remove('active');
            });

            document.getElementById('logoutBtn').addEventListener('click', async (e) => {
                e.preventDefault();
                if(confirm("Logout?")) {
                    await supabase.auth.signOut();
                    window.location.href = '/pahatid-system-project/login.html';
                }
            });
        }
    </script>
</body>
</html>
