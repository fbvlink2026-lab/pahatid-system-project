# File: .github/workflows/fix-paths.yml
# Description: SAFE Auto-Fix Pipeline with Dry Run Support & Self-Healing Logic
# Author: AI Assistant
# Date: 2026-10-08
# Version: 5.0.0 (Production Ready)
# Trigger: Manual Dispatch Only
# =========================================

name: Safe Auto-Fix Pipeline (Paths & Nav)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in DRY MODE? (Preview changes without committing)'
        required: false
        default: 'true' # DEFAULT TO TRUE FOR SAFETY
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  fix-all:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensure full history for accurate diffing if needed

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies (None Required)
        run: |
          echo "📦 Checking environment..."
          python --version

      - name: Execute Unified Auto-Fixer Script
        id: fixer
        env:
          # Pass the input variable to the script via environment if the script supports it,
          # otherwise we handle logic here in bash.
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          echo "🚀 Starting Execution..."
          echo "Mode: ${DRY_RUN_INPUT}"
          
          # Run the self-healing script
          # The script itself cleans old injections and applies new ones intelligently
          python tools/pahatid_autofix.py
          
          # Check Git Status for modifications
          if [[ $(git status --porcelain) ]]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
            echo "✅ Modifications found."
            
            # Show summary of what changed
            git diff --stat
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes detected. Repo is clean."
          fi

      - name: Prepare Commit (Exclude Backups)
        if: steps.fixer.outputs.changes_detected == 'true' && github.event.inputs.dry_run == 'false'
        run: |
          echo "🧹 Cleaning up temporary backup files before commit..."
          
          # Remove all .bak files generated by the script so they don't pollute the repo
          find . -name "*.bak" -type f -delete
          
          # Stage ONLY the modified HTML/JS/CSS files, excluding any leftover temp files
          git add driver/*.html admin/*.html commuter/*.html assets/**/*.js assets/**/*.css || true
          
          # Verify staging
          git status

      - name: Commit and Push Changes
        if: steps.fixer.outputs.changes_detected == 'true' && github.event.inputs.dry_run == 'false'
        run: |
          git config --global user.name 'Pahatid Automation Bot'
          git config --global user.email 'bot@pahatidsystem.com'
          
          COMMIT_MSG="chore(auto-fix): Applied Path Corrections & Dynamic Nav Injection [SAFE-MODE]"
          
          git commit -m "$COMMIT_MSG"
          
          # Push to current branch
          git push origin HEAD:${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Report Final Status
        if: always()
        run: |
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            if [[ "${{ steps.fixer.outputs.changes_detected }}" == "true" ]]; then
              echo "⚠️ DRY RUN COMPLETE: Changes were PREVIEWED but NOT committed."
              echo "Review the logs above. If satisfied, re-run with 'dry_run: false'."
            else
              echo "✅ DRY RUN COMPLETE: No changes needed. Codebase is optimal."
            fi
          else
            if [[ "${{ steps.fixer.outputs.changes_detected }}" == "true" ]]; then
              echo " SUCCESS: Fixes applied and pushed to remote repository."
            else
              echo "✅ SUCCESS: No fixes were necessary. Repository is up-to-date."
            fi
          fi
