name: Auto-Fix Pipeline (Unified)

on:
  workflow_dispatch: # Manual trigger only

jobs:
  fix-all:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Unified Auto-Fixer
        id: fixer
        run: |
          echo "🚀 Running tools/pahatid_autofix.py ..."
          python tools/pahatid_autofix.py
          
          # Check if any files were modified by git status
          if [[ $(git status --porcelain) ]]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
            echo "✅ Changes detected."
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes necessary."
          fi

      - name: Commit and Push Changes
        if: steps.fixer.outputs.changes_detected == 'true'
        run: |
          git config --global user.name 'Pahatid Automation Bot'
          git config --global user.email 'bot@pahatidsystem.com'
          
          git add .
          
          # Exclude backup files from commit if you don't want them in repo history
          # Note: Make sure *.bak is in .gitignore ideally, but this handles it explicitly here too
          git reset HEAD '*.bak' 2>/dev/null || true
          
          COMMIT_MSG="chore(auto-fix): Applied Path Corrections & Dynamic Nav Injection [UNIFIED]"
          
          git commit -m "$COMMIT_MSG"
          git push origin HEAD:${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Report Status
        if: always()
        run: |
          if [[ "${{ steps.fixer.outputs.changes_detected }}" == "false" ]]; then
            echo "✅ SUCCESS: Repository is already optimized."
          else
            echo "✅ SUCCESS: Automated fixes applied and pushed."
          fi
