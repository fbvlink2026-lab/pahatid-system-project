# =========================================

name: Fix Hardcoded Paths (Manual)

on:
  # Runs ONLY when manually triggered from the Actions tab
  workflow_dispatch:

jobs:
  fix-paths:
    runs-on: ubuntu-latest
    
    # Grant write access so the bot can commit changes back to the repo
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch all history for proper diffing if needed later
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install pyyaml

      - name: Run Path Fixer Script
        id: fixer
        run: |
          # Execute the script located in tools/ folder
          python tools/fix_paths.py
          
          # Check if git sees any changes
          if [[ $(git status --porcelain) ]]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
            echo "Found changes to commit."
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
          fi

      - name: Commit and Push Changes
        if: steps.fixer.outputs.changes_detected == 'true'
        run: |
          git config --global user.name 'Pahatid Bot'
          git config --global user.email 'bot@pahatidsystem.com'
          
          git add .
          git commit -m "chore(auto-fix): Corrected hardcoded paths to relative URLs [MANUAL RUN]"
          
          # Pull latest changes first to avoid merge conflicts
          git pull origin ${{ github.ref_name }} --rebase
          
          git push origin HEAD:${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Report Status
        if: steps.fixer.outputs.changes_detected == 'false'
        run: echo "✅ No path fixes were necessary. All links are already relative."
