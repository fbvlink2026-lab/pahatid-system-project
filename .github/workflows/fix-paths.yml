name: Fix Hardcoded Paths (Manual)

on:
  workflow_dispatch:

jobs:
  fix-paths:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # No need to install pyyaml anymore!
      - name: Run Path Fixer Script
        id: fixer
        run: |
          python tools/fix_paths.py
          
          if [[ $(git status --porcelain) ]]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push Changes
        if: steps.fixer.outputs.changes_detected == 'true'
        run: |
          git config --global user.name 'Pahatid Bot'
          git config --global user.email 'bot@pahatidsystem.com'
          
          git add .
          git commit -m "chore(auto-fix): Corrected hardcoded paths [STANDALONE SCRIPT]"
          git push origin HEAD:${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Report Status
        if: steps.fixer.outputs.changes_detected == 'false'
        run: echo "✅ No path fixes were necessary."
