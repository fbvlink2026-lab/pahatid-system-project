<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip History | Pahatid Driver</title>
    
    <!-- CSS Libraries -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="../assets/css/style.css">
    
    <style>
        .history-filter {
            background: white;
            padding: 1rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            margin-bottom: 1.5rem;
        }
        .trip-card {
            border-left: 4px solid var(--pahatid-primary);
            transition: all 0.2s;
        }
        .trip-card:hover {
            transform: translateX(5px);
            box-shadow: var(--shadow-md);
        }
        .trip-card.negative-income {
            border-left-color: var(--pahatid-danger);
        }
        .income-badge {
            font-size: 1.1rem;
            font-weight: bold;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #6c757d;
            padding: 0.25rem 0;
        }
        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .stat-box {
            background: white;
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }
        .stat-value {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--pahatid-primary);
        }
        .stat-label {
            font-size: 0.8rem;
            color: #6c757d;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- Mobile Menu Toggle Button -->
    <button class="mobile-menu-toggle" id="menuToggleBtn" aria-label="Toggle Navigation">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-wrapper">
        
        <!-- GLOBAL SIDEBAR NAVIGATION (Driver Context) -->
                <!-- SIDEBAR NAVIGATION (Dynamic) -->
                <!-- SIDEBAR NAVIGATION (Dynamic) -->
                <!-- SIDEBAR NAVIGATION (Dynamic) -->
                <!-- SIDEBAR NAVIGATION (Dynamic) -->
        <aside class="sidebar" id="globalSidebar">
            <div class="sidebar-header p-3 border-bottom border-dark">
                <a href="/pahatid-system-project/" class="text-decoration-none text-white fw-bold fs-5 d-block">
                    <i class="fas fa-motorcycle text-warning me-2"></i> Pahatid<span class="fw-normal ms-1">Driver</span>
                </a>
            </div>
            <ul class="nav flex-column p-2" id="dynamicNavList">
                <!-- Items loaded by sidebar-loader.js -->
            </ul>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="main-content">
            
            <header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <div>
                    <h4 class="mb-0 fw-bold">Trip History</h4>
                    <small class="text-muted">Review your past earnings and expenses.</small>
                </div>
                <button class="btn btn-outline-secondary shadow-sm" onclick="window.print()">
                    <i class="fas fa-print me-2"></i> Print Report
                </button>
            </header>

            <!-- Summary Stats Row -->
            <div class="summary-stats">
                <div class="stat-box">
                    <div class="stat-value" id="totalTrips">0</div>
                    <div class="stat-label">Total Trips</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value text-success" id="totalNetIncome">₱0.00</div>
                    <div class="stat-label">Total Net Income</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value text-danger" id="totalExpenses">₱0.00</div>
                    <div class="stat-label">Total Expenses</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value text-info" id="avgPerTrip">₱0.00</div>
                    <div class="stat-label">Avg Per Trip</div>
                </div>
            </div>

            <!-- Filters -->
            <div class="history-filter d-flex gap-3 align-items-center flex-wrap">
                <div>
                    <label class="form-label small fw-bold mb-1">Date Range</label>
                    <select class="form-select form-select-sm" id="dateFilter">
                        <option value="all">All Time</option>
                        <option value="today">Today</option>
                        <option value="week">This Week</option>
                        <option value="month">This Month</option>
                    </select>
                </div>
                <div>
                    <label class="form-label small fw-bold mb-1">Sort By</label>
                    <select class="form-select form-select-sm" id="sortOrder">
                        <option value="desc">Newest First</option>
                        <option value="asc">Oldest First</option>
                    </select>
                </div>
                <div class="ms-auto">
                    <button class="btn btn-primary btn-sm" onclick="loadHistory()">Apply Filters</button>
                </div>
            </div>

            <!-- History List Container -->
            <div id="historyContainer" class="d-flex flex-column gap-3">
                <!-- Populated by JS -->
                <div class="text-center py-5 text-muted">
                    <i class="fas fa-spinner fa-spin fa-2x mb-2"></i>
                    <p>Loading history...</p>
                </div>
            </div>

        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script type="module">
        import { supabase, formatCurrency } from '../assets/js/config.js';

        // --- STATE MANAGEMENT ---
        let currentUserId = null;
        let allLogs = []; // Store raw data for filtering without re-fetching if possible

        // DOM Elements
        const historyContainer = document.getElementById('historyContainer');
        const totalTripsEl = document.getElementById('totalTrips');
        const totalNetIncomeEl = document.getElementById('totalNetIncome');
        const totalExpensesEl = document.getElementById('totalExpenses');
        const avgPerTripEl = document.getElementById('avgPerTrip');
        const dateFilter = document.getElementById('dateFilter');
        const sortOrder = document.getElementById('sortOrder');

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            loadHistory();
            setupEventListeners();
        });

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = '/pahatid-system-project/login.html';
                return;
            }
            
            const { data: profile } = await supabase.from('profiles').select('role').eq('id', session.user.id).single();
            if (profile.role !== 'driver') {
                alert("Access Denied.");
                window.location.href = '/pahatid-system-project/index.html';
            }
            currentUserId = session.user.id;
        }

        // --- DATA LOADING ---
        async function loadHistory() {
            try {
                historyContainer.innerHTML = '<div class="text-center py-5 text-muted"><i class="fas fa-spinner fa-spin fa-2x mb-2"></i><p>Fetching records...</p></div>';

                // Determine Date Filter Logic
                const filterType = dateFilter.value;
                let query = supabase
                    .from('trip_logs')
                    .select('*')
                    .eq('driver_profile_id', currentUserId);

                const now = new Date();
                
                if (filterType === 'today') {
                    const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                    const endOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
                    query = query.gte('logged_at', startOfDay.toISOString()).lte('logged_at', endOfDay.toISOString());
                } else if (filterType === 'week') {
                    const startOfWeek = new Date(now.setDate(now.getDate() - now.getDay()));
                    startOfWeek.setHours(0,0,0,0);
                    query = query.gte('logged_at', startOfWeek.toISOString());
                } else if (filterType === 'month') {
                    const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
                    query = query.gte('logged_at', startOfMonth.toISOString());
                }
                // 'all' does nothing extra

                // Execute Query
                const { data, error } = await query.order('logged_at', { ascending: sortOrder.value === 'asc' });

                if (error) throw error;

                allLogs = data || [];
                renderSummaryStats(allLogs);
                renderHistoryList(allLogs);

            } catch (err) {
                console.error(err);
                historyContainer.innerHTML = `<div class="alert alert-danger">Error loading history: ${err.message}</div>`;
            }
        }

        function renderSummaryStats(logs) {
            if (!logs || logs.length === 0) {
                totalTripsEl.textContent = "0";
                totalNetIncomeEl.textContent = formatCurrency(0);
                totalExpensesEl.textContent = formatCurrency(0);
                avgPerTripEl.textContent = formatCurrency(0);
                return;
            }

            const count = logs.length;
            const totalNet = logs.reduce((sum, l) => sum + parseFloat(l.net_income), 0);
            const totalExp = logs.reduce((sum, l) => sum + parseFloat(l.total_expenses), 0);
            const avg = totalNet / count;

            totalTripsEl.textContent = count;
            totalNetIncomeEl.textContent = formatCurrency(totalNet);
            totalExpensesEl.textContent = formatCurrency(totalExp);
            avgPerTripEl.textContent = formatCurrency(avg);
        }

        function renderHistoryList(logs) {
            if (!logs || logs.length === 0) {
                historyContainer.innerHTML = '<div class="alert alert-light text-center">No trips found for this period.</div>';
                return;
            }

            historyContainer.innerHTML = logs.map(log => {
                const isNegative = log.net_income < 0;
                const cardClass = isNegative ? 'negative-income' : '';
                const dateObj = new Date(log.logged_at);
                const dateStr = dateObj.toLocaleDateString('en-PH', { year: 'numeric', month: 'short', day: 'numeric' });
                const timeStr = dateObj.toLocaleTimeString('en-PH', { hour: '2-digit', minute: '2-digit' });
                
                // Truncate addresses if too long
                const pickupShort = log.pickup_lat ? `${log.pickup_lat.toFixed(4)}, ${log.pickup_lng?.toFixed(4)}` : 'N/A';
                const dropoffShort = log.dropoff_lat ? `${log.dropoff_lat.toFixed(4)}, ${log.dropoff_lng?.toFixed(4)}` : 'N/A';

                return `
                <div class="card trip-card ${cardClass} shadow-sm">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div>
                                <h6 class="fw-bold mb-1">${log.vehicle_used_name || 'Motorcycle'}</h6>
                                <small class="text-muted">${dateStr} • ${timeStr}</small>
                            </div>
                            <div class="text-end">
                                <div class="income-badge ${isNegative ? 'text-danger' : 'text-success'}">
                                    ${formatCurrency(log.net_income)}
                                </div>
                                <small class="text-muted d-block">Net Income</small>
                            </div>
                        </div>
                        
                        <hr class="my-2 opacity-25">
                        
                        <div class="row g-2 small">
                            <div class="col-md-6">
                                <div class="detail-row">
                                    <span>Distance:</span>
                                    <strong>${log.distance_km} km</strong>
                                </div>
                                <div class="detail-row">
                                    <span>Duration:</span>
                                    <strong>${(log.duration_hours * 60).toFixed(0)} mins</strong>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="detail-row">
                                    <span>Gross Fare:</span>
                                    <strong>${formatCurrency(log.gross_fare)}</strong>
                                </div>
                                <div class="detail-row">
                                    <span>Total Exp:</span>
                                    <strong class="text-danger">-${formatCurrency(log.total_expenses)}</strong>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-2 pt-2 border-top small text-muted">
                            <i class="fas fa-map-marker-alt me-1"></i> From: ${pickupShort} 
                            <br><i class="fas fa-flag-checkered me-1"></i> To: ${dropoffShort}
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        // --- EVENT LISTENERS ---
        function setupEventListeners() {
            // Auto-load on filter change
            dateFilter.addEventListener('change', loadHistory);
            sortOrder.addEventListener('change', loadHistory);

            // Mobile Menu
            const menuToggleBtn = document.getElementById('menuToggleBtn');
            const globalSidebar = document.getElementById('globalSidebar');
            const sidebarOverlay = document.getElementById('sidebarOverlay');

            function toggleSidebar() {
                globalSidebar.classList.toggle('open');
                sidebarOverlay.classList.toggle('active');
            }

            if (menuToggleBtn) menuToggleBtn.addEventListener('click', toggleSidebar);
            if (sidebarOverlay) sidebarOverlay.addEventListener('click', () => {
                globalSidebar.classList.remove('open');
                sidebarOverlay.classList.remove('active');
            });

            // Logout
            document.getElementById('logoutBtn').addEventListener('click', async (e) => {
                e.preventDefault();
                if(confirm("Logout?")) {
                    await supabase.auth.signOut();
                    window.location.href = '/pahatid-system-project/login.html';
                }
            });
        }
    </script>


    <!-- AUTO-INJECTED NAV LOADER BY pahatid_autofix.py -->
    <script type="module">
    import { loadDynamicSidebar } from '../assets/js/sidebar-loader.js';
    
    document.addEventListener('DOMContentLoaded', async () => {
        const currentPath = window.location.pathname;
        let role = 'driver'; 
        
        if (currentPath.includes('/admin/')) role = 'admin';
        else if (currentPath.includes('/commuter/')) role = 'commuter';
        
        await loadDynamicSidebar('dynamicNavList', role);
    });
    </script>

</body>
</html>
