    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script type="module">
        import { supabase, formatCurrency } from '../assets/js/config.js';

        let currentUserId = null;
        let realtimeChannel = null;
        const tasksContainer = document.getElementById('tasksContainer');
        
        // State for Modal
        let pendingCancelBookingId = null;

        // DOM Elements for Modal
        const cancelModal = document.getElementById('cancelReasonModal');
        const driverCancelForm = document.getElementById('driverCancelForm');
        const customDriverReasonInput = document.getElementById('customDriverReasonInput');
        const radioButtons = document.querySelectorAll('input[name="driver_cancel_reason"]');

        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            loadTasks();
            subscribeToRealtime();
            setupEventListeners();
            setupModalLogic();
        });

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = '/pahatid-system-project/login.html'; return; }
            currentUserId = session.user.id;
        }

        async function loadTasks() {
            try {
                tasksContainer.innerHTML = `<div class="text-center py-3"><i class="fas fa-spinner fa-spin"></i> Updating...</div>`;

                // 1. Fetch MY assigned tasks (Include cancellation_requested in filter)
                const { data: myAssigned, error: errAssigned } = await supabase
                    .from('bookings')
                    .select(`*, profiles:commuter_profile_id(full_name, phone_number)`)
                    .eq('driver_profile_id', currentUserId)
                    .in('trip_status', ['accepted', 'arrived_pickup', 'in_progress', 'cancellation_requested'])
                    .order('created_at', { ascending: false });

                if (errAssigned) throw errAssigned;

                // 2. Fetch OPEN POOL tasks
                const { data: openPool, error: errOpen } = await supabase
                    .from('bookings')
                    .select(`*, profiles:commuter_profile_id(full_name, phone_number)`)
                    .is('driver_profile_id', null) 
                    .eq('trip_status', 'requested') 
                    .order('created_at', { ascending: true }); 

                if (errOpen) throw errOpen;

                renderTasks(myAssigned || [], openPool || []);

            } catch (err) {
                console.error(err);
                tasksContainer.innerHTML = `<div class="alert alert-danger m-3">Error: ${err.message}</div>`;
            }
        }

        function renderTasks(assignedTasks, openTasks) {
            if ((!assignedTasks || assignedTasks.length === 0) && (!openTasks || openTasks.length === 0)) {
                tasksContainer.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><h5>No Active Tasks</h5></div>`;
                return;
            }

            let html = '';
            if (assignedTasks?.length > 0) {
                html += `<h6 class="fw-bold text-uppercase text-muted mb-3"><i class="fas fa-route me-2"></i> My Current Trips</h6>`;
                html += assignedTasks.map(task => createTaskCard(task, 'mine')).join('');
            }
            if (openTasks?.length > 0) {
                html += `<hr class="my-4 border-warning"><h6 class="fw-bold text-uppercase text-warning mb-3"><i class="fas fa-hand-holding-heart me-2"></i> Available Jobs</h6>`;
                html += openTasks.map(task => createTaskCard(task, 'available')).join('');
            }
            tasksContainer.innerHTML = html;
        }

        function createTaskCard(task, type) {
            const commuterName = task.profiles?.full_name || 'Commuter';
            const fare = formatCurrency(task.final_fare);
            let badgeClass = 'bg-secondary';
            let statusText = task.trip_status.replace('_', ' ').toUpperCase();
            let cardClass = '';

            if (type === 'available') {
                badgeClass = 'bg-warning text-dark';
                statusText = 'AVAILABLE';
                cardClass = 'available pulse-available';
            } else {
                if (task.trip_status === 'accepted') badgeClass = 'bg-info text-dark';
                else if (task.trip_status === 'arrived_pickup') badgeClass = 'bg-primary';
                else if (task.trip_status === 'in_progress') badgeClass = 'bg-success';
                else if (task.trip_status === 'cancellation_requested') {
                    badgeClass = 'bg-danger';
                    statusText = 'CANCEL PENDING';
                    cardClass = 'cancellation_requested';
                }
                else cardClass = task.trip_status;
            }

            let actionsHtml = '';
            const goToDashBtn = `<button class="btn btn-sm btn-outline-info" onclick="goToDashboardWithTask('${task.booking_id}')"><i class="fas fa-map-marked-alt me-1"></i> Go to Nav</button>`;

            if (type === 'available') {
                actionsHtml = `<div class="action-btn-group">${goToDashBtn}<button class="btn btn-sm btn-warning flex-grow-1 py-2 fw-bold" onclick="claimTask('${task.booking_id}')"><i class="fas fa-bolt me-1"></i> ACCEPT</button></div>`;
            } else if (task.trip_status === 'accepted') {
                actionsHtml = `
                    <div class="action-btn-group">
                        ${goToDashBtn}
                        <button class="btn btn-sm btn-success flex-grow-1" onclick="updateStatus(${task.booking_id}, 'arrived_pickup')">Arrived</button>
                        <button class="btn btn-sm btn-danger" onclick="rejectTaskRpc(${task.booking_id})">Reject</button>
                    </div>`;
            } else if (task.trip_status === 'arrived_pickup') {
                // If arrived, driver can either Start Trip OR Request Cancellation (No Show)
                actionsHtml = `
                    <div class="action-btn-group">
                        ${goToDashBtn}
                        <button class="btn btn-sm btn-primary flex-grow-1" onclick="updateStatus(${task.booking_id}, 'in_progress')">Start Trip</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="openCancelModal(${task.booking_id})">Req. Cancel</button>
                    </div>`;
            } else if (task.trip_status === 'in_progress') {
                actionsHtml = `<div class="action-btn-group">${goToDashBtn}<button class="btn btn-sm btn-success w-100 py-3 fs-6" onclick="completeTrip(${task.booking_id})">COMPLETE TRIP</button></div>`;
            } else if (task.trip_status === 'cancellation_requested') {
                // Display info that admin is reviewing
                actionsHtml = `
                    <div class="alert alert-warning small mb-0 p-2">
                        <i class="fas fa-hourglass-half me-1"></i> Waiting for Admin approval to cancel.
                    </div>`;
            }

            return `
                <div class="card card-custom shadow-sm mb-3 task-card ${cardClass}">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div><h6 class="fw-bold mb-0">${commuterName}</h6><small class="text-muted">${task.pickup_address ? task.pickup_address.substring(0,20)+'...' : ''}</small></div>
                            <span class="badge ${badgeClass} status-badge">${statusText}</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
                            <strong class="text-primary">${fare}</strong>
                            ${actionsHtml}
                        </div>
                    </div>
                </div>`;
        }

        window.goToDashboardWithTask = function(bookingId) {
            localStorage.setItem('pahatid_active_booking_id', bookingId);
            window.location.href = 'dashboard.html?active_task=' + bookingId;
        };

        window.claimTask = async (bookingId) => {
            if(!confirm("Accept this job?")) return;
            try {
                const { error } = await supabase.from('bookings').update({ driver_profile_id: currentUserId, trip_status: 'accepted' }).eq('booking_id', bookingId).is('driver_profile_id', null); 
                if (error) throw error;
                alert("✅ Accepted!");
                window.goToDashboardWithTask(bookingId);
            } catch (e) { alert("Failed: " + e.message); loadTasks(); }
        };

        window.rejectTaskRpc = async (bookingId) => {
            if(!confirm("REJECT TASK?\n\nSystem will verify your eligibility based on role and proximity.")) return;
            try {
                const { error } = await supabase.rpc('reject_booking', { booking_id_param: bookingId });
                if (error) {
                    alert("⛔ REJECTED BY SYSTEM:\n\n" + error.message);
                    return; 
                }
                alert("🚫 Rejected Successfully. Returned to queue.");
                setTimeout(() => location.reload(), 800); 
            } catch (e) {
                console.error(e);
                alert("❌ Unexpected Error: " + e.message);
            }
        };

        window.updateStatus = async (bookingId, newStatus) => {
            if(!confirm(`Update to "${newStatus}"?`)) return;
            try {
                const updates = { trip_status: newStatus };
                if (newStatus === 'in_progress') updates.started_at = new Date().toISOString();
                if (newStatus === 'arrived_pickup') updates.arrived_at = new Date().toISOString(); 
                const { error } = await supabase.from('bookings').update(updates).eq('booking_id', bookingId).eq('driver_profile_id', currentUserId); 
                if (error) throw error;
                alert("Updated!");
                loadTasks(); 
            } catch (e) { alert("Failed: " + e.message); }
        };

        // --- CANCELLATION REQUEST LOGIC ---

        window.openCancelModal = function(bookingId) {
            pendingCancelBookingId = bookingId;
            cancelModal.style.display = 'flex';
            driverCancelForm.reset();
            customDriverReasonInput.style.display = 'none';
            if(radioButtons[0]) radioButtons[0].checked = true;
        };

        window.closeCancelModal = function() {
            cancelModal.style.display = 'none';
            pendingCancelBookingId = null;
        };

        function setupModalLogic() {
            radioButtons.forEach(btn => {
                btn.addEventListener('change', (e) => {
                    if(e.target.value === 'other') {
                        customDriverReasonInput.style.display = 'block';
                        customDriverReasonInput.focus();
                    } else {
                        customDriverReasonInput.style.display = 'none';
                        customDriverReasonInput.value = '';
                    }
                });
            });

            driverCancelForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                if(!pendingCancelBookingId) return;

                const selectedRadio = document.querySelector('input[name="driver_cancel_reason"]:checked');
                let reasonKey = "";
                let reasonText = "";

                if(selectedRadio) {
                    reasonKey = selectedRadio.value;
                    const parentLabel = selectedRadio.closest('.reason-option');
                    const strongTag = parentLabel.querySelector('strong');
                    reasonText = strongTag ? strongTag.textContent : reasonKey;
                }

                if(reasonKey === 'other') {
                    const customVal = customDriverReasonInput.value.trim();
                    if(!customVal) {
                        alert("Please specify the reason.");
                        return;
                    }
                    reasonText = customVal;
                }

                await submitCancellationRequest(pendingCancelBookingId, reasonKey, reasonText);
            });
        }

        async function submitCancellationRequest(bookingId, reasonKey, reasonDisplayText) {
            if(!confirm(`Send cancellation request?\n\nReason: "${reasonDisplayText}"\n\nThis requires Admin Approval.`)) return;

            try {
                // UPDATE USING DEDICATED COLUMNS CREATED IN STEP 1
                const { error } = await supabase
                    .from('bookings')
                    .update({ 
                        trip_status: 'cancellation_requested',
                        cancellation_reason_code: reasonKey,       // New Column
                        cancellation_reason_text: reasonDisplayText, // New Column
                        cancelled_by_role: 'driver',               // New Column
                        cancelled_at: new Date().toISOString()     // New Column
                    })
                    .eq('booking_id', bookingId)
                    .eq('driver_profile_id', currentUserId); // Security check

                if (error) throw error;

                alert("📨 Request Sent. Waiting for Admin Review.");
                closeCancelModal();
                loadTasks(); // Refresh to show new status

            } catch (err) {
                console.error(err);
                alert("❌ Failed to send request: " + err.message);
            }
        }

        // --- COMPLETE TRIP LOGIC (WITH OSRM CHECK) ---
        window.completeTrip = async (bookingId) => {
             if(!confirm("Mark this trip as COMPLETED?\n\nSystem is verifying your arrival via Road Network...")) return;

             try {
                 const { data: booking, error: fetchErr } = await supabase
                     .from('bookings')
                     .select('*')
                     .eq('booking_id', bookingId)
                     .single();

                 if (fetchErr || !booking) throw new Error("Could not retrieve booking details.");

                 const { data: driverData, error: drvErr } = await supabase
                    .from('drivers')
                    .select('custom_efficiency_kml, employment_type, current_latitude, current_longitude')
                    .eq('user_profile_id', currentUserId)
                    .single();
                 
                 if(drvErr) throw drvErr;

                 const dropLat = parseFloat(booking.dropoff_lat);
                 const dropLng = parseFloat(booking.dropoff_lng);
                 const driverLat = parseFloat(driverData.current_latitude);
                 const driverLng = parseFloat(driverData.current_longitude);

                 if (isNaN(dropLat) || isNaN(dropLng) || isNaN(driverLat) || isNaN(driverLng)) {
                     throw new Error("Security Block: Missing GPS Data. Cannot complete trip without valid location tracking.");
                 }

                 const distToDestKm = await getOsrmDistanceKm(driverLat, driverLng, dropLat, dropLng);
                 
                 if (distToDestKm > 0.5) {
                     throw new Error(`Security Block: You are ${(distToDestKm * 1000).toFixed(0)}m away by road. Please arrive at destination first.`);
                 }

                 const efficiency = parseFloat(driverData.custom_efficiency_kml) || 35.0;
                 const isHired = driverData.employment_type === 'hired';

                 const distanceKm = parseFloat(booking.actual_distance_km || booking.estimated_distance_km || 0);
                 const grossFare = parseFloat(booking.final_fare || 0);
                 const platformCommission = grossFare * 0.15; 
                 const litersUsed = distanceKm / efficiency;
                 const gasPriceEstimate = 65.00; 
                 const fuelCost = litersUsed * gasPriceEstimate;

                 let rentalProrate = 0;
                 let maintProrate = 0;
                 const expectedWorkHours = 8.0;
                 
                 let durationHours = 0;
                 if (booking.started_at) {
                     const start = new Date(booking.started_at).getTime();
                     const end = new Date().getTime(); 
                     durationHours = (end - start) / (1000 * 60 * 60);
                 } else {
                     durationHours = distanceKm / 30; 
                 }

                 if (isHired) {
                     rentalProrate = (150 / expectedWorkHours) * durationHours;
                     maintProrate = (50 / expectedWorkHours) * durationHours;
                 }

                 const totalExpenses = fuelCost + rentalProrate + maintProrate;
                 const netIncome = grossFare - platformCommission - totalExpenses;

                 const logEntry = {
                     driver_profile_id: currentUserId,
                     booking_id: booking.booking_id,
                     pickup_lat: booking.pickup_lat,
                     pickup_lng: booking.pickup_lng,
                     dropoff_lat: booking.dropoff_lat,
                     dropoff_lng: booking.dropoff_lng,
                     distance_km: parseFloat(distanceKm.toFixed(3)),
                     duration_hours: parseFloat(durationHours.toFixed(4)),
                     gross_fare: parseFloat(grossFare.toFixed(2)),
                     platform_commission: parseFloat(platformCommission.toFixed(2)),
                     fuel_cost: parseFloat(fuelCost.toFixed(2)),
                     rental_prorated_cost: parseFloat(rentalProrate.toFixed(2)),
                     maintenance_prorated_cost: parseFloat(maintProrate.toFixed(2)),
                     total_expenses: parseFloat(totalExpenses.toFixed(2)),
                     net_income: parseFloat(netIncome.toFixed(2)),
                     vehicle_used_name: isHired ? "Corporate Vehicle" : "Personal Vehicle",
                     notes: `AUTO_LOG | Ref:${booking.reference_code} | Verified_OSRM:true`,
                     logged_at: new Date().toISOString(),
                     fuel_consumed_liters: parseFloat(litersUsed.toFixed(3)),
                     is_self_assigned: !!booking.is_manual_log
                 };

                 const { error: logErr } = await supabase.from('trip_logs').insert(logEntry);
                 if (logErr) throw new Error("Failed to save trip log: " + logErr.message);

                 const { error: updErr } = await supabase
                     .from('bookings')
                     .update({ 
                         trip_status: 'completed',
                         ended_at: new Date().toISOString(),
                         payment_status: 'paid'
                     })
                     .eq('booking_id', bookingId)
                     .eq('driver_profile_id', currentUserId);

                 if (updErr) throw updErr;

                 localStorage.removeItem('pahatid_active_booking_id');

                 alert(`✅ Trip Completed!\nNet Income Added: ${formatCurrency(netIncome)}\n\nCheck your History/Wallet.`);
                 window.location.href = 'history.html'; 
                 
             } catch (e) { 
                 console.error(e);
                 alert("❌ ERROR: " + e.message);
             }
        };

        async function getOsrmDistanceKm(lat1, lon1, lat2, lon2) {
            if (!lat1 || !lon1 || !lat2 || !lon2) return Infinity;
            try {
                const url = `https://router.project-osrm.org/route/v1/driving/${lon1},${lat1};${lon2},${lat2}?overview=false`;
                const response = await fetch(url);
                if (!response.ok) throw new Error("Network error");
                const data = await response.json();
                if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
                    return data.routes[0].distance / 1000; 
                } else {
                    return Infinity;
                }
            } catch (err) {
                return Infinity;
            }
        }

        function subscribeToRealtime() {
            if (realtimeChannel) supabase.removeChannel(realtimeChannel);
            realtimeChannel = supabase.channel('driver-tasks-global')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'bookings' }, () => {
                    clearTimeout(window.taskReloadTimer);
                    window.taskReloadTimer = setTimeout(loadTasks, 1000);
                }).subscribe();
        }

        function setupEventListeners() {
            const menuToggleBtn = document.getElementById('menuToggleBtn');
            const globalSidebar = document.getElementById('globalSidebar');
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            function toggleSidebar() { globalSidebar.classList.toggle('open'); sidebarOverlay.classList.toggle('active'); }
            if(menuToggleBtn) menuToggleBtn.addEventListener('click', toggleSidebar);
            if(sidebarOverlay) sidebarOverlay.addEventListener('click', () => { globalSidebar.classList.remove('open'); sidebarOverlay.classList.remove('active'); });
            document.getElementById('logoutBtn').addEventListener('click', async (e) => { e.preventDefault(); if(confirm("Logout?")) { await supabase.auth.signOut(); window.location.href = '/pahatid-system-project/login.html'; } });
        }
        
        window.addEventListener('beforeunload', () => { if (realtimeChannel) supabase.removeChannel(realtimeChannel); });
    </script>
